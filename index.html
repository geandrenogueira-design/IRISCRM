/* ---- Ações ---- */
function fuEnviarRapido(ev,id){
  const e=fuAchar(id);
  if(!e){ ev.preventDefault(); toast("Esse follow-up já foi registrado."); render(); return false; }
  fuRegistrar(e,"enviado",fuTexto(e));
  // O render espera o clique terminar: trocar o DOM no meio do clique
  // pode engolir a abertura do WhatsApp em alguns navegadores.
  setTimeout(()=>{ render(); toast("Registrado: "+e.regra.nome.toLowerCase()+" para "+primeiroNome(e.cliente.nome)+"."); },60);
  return true;
}
function fuPular(id){
  const e=fuAchar(id); if(!e){ render(); return; }
  fuRegistrar(e,"pulado","");
  render(); toast("Etapa pulada para "+primeiroNome(e.cliente.nome)+".");
}
function fuDesfazer(fid){
  if(!podeAdmin()){ toast("Só o administrador desfaz registros."); return; }
  DB.followups=fuLista().filter(f=>f.id!==fid);
  salvar({_remover:{followups:[fid]}}); render(); toast("Registro desfeito. A etapa volta para a fila.");
}

/* Revisar: editar o texto antes de mandar. Em sequência, o próximo
   cliente abre sozinho depois de cada envio — é o mais perto de
   automático que dá para chegar sem a API paga do WhatsApp. */
let fuSeq=false;
function fuSequencia(){ fuSeq=true; fuProximoDaSequencia(); }
function fuProximoDaSequencia(){
  const lista=fuPendentes().hoje.filter(e=>onlyDigits(e.cliente.telefone));
  if(!lista.length){ fuSeq=false; closeModal(); render(); toast("Fila de follow-up zerada."); return; }
  fuRevisar(lista[0].id, lista.length);
}
function fuRevisar(id, restantes){
  const e=fuAchar(id); if(!e){ toast("Esse follow-up já foi registrado."); render(); return; }
  if(!restantes) fuSeq=false;
  const c=e.cliente, txt=fuTexto(e), tel=!!onlyDigits(c.telefone);
  openModal(`<div class="modal"><div class="modal-h"><h3>${fuSeq?"Sequência · ":""}${escFila(c.nome)}</h3>
      ${fuSeq?`<span class="chip neutral" style="margin-left:8px">${plural(restantes,"restante","restantes")}</span>`:""}
      <button class="close-x" onclick="fuSeq=false;closeModal();render()">×</button></div>
    <div class="modal-b">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span class="chip accent">${escFila(e.regra.nome)}</span><span class="muted" style="font-size:12.5px">${fuQuando(e)}</span>
        ${e.libera?`<span class="chip warn">recebeu mensagem há pouco, libera em ${e.libera.toLocaleDateString("pt-BR")}</span>`:""}
      </div>
      <div class="field"><label>Mensagem</label>
        <textarea id="fuMsg" rows="6" oninput="fuAtualizaLink()">${escFila(txt)}</textarea></div>
      <p class="muted" style="font-size:12px;margin:0">${tel?"Editar aqui muda só esta mensagem. O modelo da etapa fica como está.":"Cliente sem telefone cadastrado: dá para pular ou abrir a ficha e completar."}</p>
    </div>
    <div class="modal-f">
      <button class="btn" style="margin-right:auto" onclick="fuSeq=false;closeModal();abrirCliente('${c.id}')">Ficha</button>
      <button class="btn" onclick="fuPularRevisado('${e.id}')">Pular</button>
      ${tel?`<a class="btn primary" id="fuWa" target="_blank" rel="noopener" data-tel="${escFila(c.telefone)}"
          href="${waLink(c.telefone,txt)}" onclick="return fuEnviarRevisado(event,'${e.id}')">${fuSeq?"Enviar e próximo":"Abrir no WhatsApp"}</a>`:""}
    </div></div>`);
}
function fuAtualizaLink(){
  const a=$("#fuWa"), t=$("#fuMsg"); if(!a||!t) return;
  a.href=waLink(a.dataset.tel, t.value);
}
function fuEnviarRevisado(ev,id){
  const e=fuAchar(id);
  if(!e){ ev.preventDefault(); toast("Esse follow-up já foi registrado."); closeModal(); render(); return false; }
  const txt=($("#fuMsg")||{}).value||fuTexto(e);
  fuRegistrar(e,"enviado",txt);
  setTimeout(()=>{ if(fuSeq) fuProximoDaSequencia(); else { closeModal(); render(); toast("Registrado como enviado."); } },60);
  return true;
}
function fuPularRevisado(id){
  const e=fuAchar(id); if(e) fuRegistrar(e,"pulado","");
  if(fuSeq) fuProximoDaSequencia(); else { closeModal(); render(); toast("Etapa pulada."); }
}

/* ---- Edição da régua (admin) ---- */
function fuGravarRegras(regras, intervaloMin){
  const atual=fuCfg();
  DB.config.followup={ regras, intervaloMin: intervaloMin!=null ? intervaloMin : atual.intervaloMin };
  salvar({config:DB.config});
}
function fuAlternar(id, ligado){
  if(!podeAdmin()) return;
  const regras=fuCfg().regras.map(r=>r.id===id?{...r,ativo:!!ligado}:r);
  fuGravarRegras(regras); render(); toast(ligado?"Etapa ligada.":"Etapa desligada.");
}
function fuSalvarIntervalo(){
  if(!podeAdmin()) return;
  const v=Math.max(0,Math.min(60,+$("#fuIntervalo").value||0));
  fuGravarRegras(fuCfg().regras, v); render(); toast("Intervalo mínimo: "+plural(v,"dia","dias")+".");
}
function fuRestaurarPadrao(){
  if(!podeAdmin()) return;
  if(!confirm("Voltar a régua para as 6 etapas padrão? Etapas criadas ou textos editados serão substituídos.\n\nO histórico de envios não é apagado.")) return;
  fuGravarRegras(fuRegrasPadrao()); render(); toast("Régua padrão restaurada.");
}
function fuModalRegra(id){
  const adm=podeAdmin();

  const dis=adm?"":"disabled";

          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 9px">

      ${adm?`<div class="vars">${FU_VARS.map(([k,dsc])=>`<button type="button" title="${dsc}" onclick="fuInserirVar('${k}')">{${k}}</button>`).join("")}</div>`:""}
      <div class="field" style="margin-top:14px"><label>Como chega para o cliente <span class="muted" id="rgPrevQuem" style="font-weight:500"></span></label>
        <div class="fu-prev" id="rgPrev"></div></div>

      <button class="btn" onclick="closeModal()">${adm?"Cancelar":"Fechar"}</button>
      ${adm?`<button class="btn primary" onclick="fuSalvarRegra('${id||""}')">Salvar</button>`:""}

  fuRegraGatilho();
}
function fuRegraGatilho(){
  const g=FU_GATILHOS[$("#rgGat").value]; if(!g) return;
  $("#rgPrazoBox").style.display = g.unidade ? "" : "none";
  $("#rgPrazoLbl").textContent = g.unidade ? "Prazo ("+g.unidade+")" : "Prazo";
  $("#rgAjuda").textContent = g.ajuda;
  fuRegraPreview();
}
function fuInserirVar(k){
  const t=$("#rgTexto"); if(!t) return;
  // Clicar no botão tira o foco do texto; a posição guardada no blur diz onde
  // o cursor estava. Se a pessoa nunca clicou no texto, a variável vai para o fim.
  const pos=t.dataset.pos!=null ? +t.dataset.pos : t.value.length;
  const ini=pos, fim=pos, ins="{"+k+"}";
  t.value=t.value.slice(0,ini)+ins+t.value.slice(fim);
  t.focus(); t.selectionStart=t.selectionEnd=ini+ins.length; t.dataset.pos=ini+ins.length;
  fuRegraPreview();
}
// Prévia com um cliente de verdade da base, para a pessoa ver o texto como ele sai.
function fuRegraPreview(){
  const box=$("#rgPrev"); if(!box) return;
  const regra={ id:"_prev", nome:"", gatilho:$("#rgGat").value, prazo:+$("#rgPrazo").value||0, ativo:true, texto:$("#rgTexto").value };
  const c=DB.clientes.find(x=>onlyDigits(x.telefone)) || {id:"_", nome:"Maria Exemplo", telefone:""};
  const n=DB.negocios.filter(x=>x.clienteId===c.id && x.etapa==="ganho").sort((a,b)=>(a.fechadoEm||"")<(b.fechadoEm||"")?1:-1)[0];
  box.textContent=fuTexto({regra, cliente:c, ctx:{negocio:n||null}});
  const q=$("#rgPrevQuem"); if(q) q.textContent="· exemplo com "+primeiroNome(c.nome);
}
function fuSalvarRegra(id){
  if(!podeAdmin()) return;
  const nome=$("#rgNome").value.trim(), texto=$("#rgTexto").value.trim();
  if(!nome){ toast("Dê um nome para a etapa."); return; }
  if(!texto){ toast("Escreva o texto da mensagem."); return; }
  const dados={ nome, gatilho:$("#rgGat").value, prazo:Math.max(0,+$("#rgPrazo").value||0), ativo:$("#rgAtivo").checked, texto };
  let regras=fuCfg().regras.slice();
  if(id){
    // Mudar o gatilho de uma etapa existente muda o que a referência significa
    // (negócio, receita, cliente). Ela vira etapa nova, com id novo, para o
    // histórico antigo não bloquear nem liberar envio por engano.
    const antiga=regras.find(r=>r.id===id);
    if(antiga && antiga.gatilho!==dados.gatilho){
      regras=regras.filter(r=>r.id!==id); regras.push({id:"r"+uid(),...dados});
    } else regras=regras.map(r=>r.id===id?{...r,...dados}:r);
  } else regras.push({id:"r"+uid(),...dados});
  fuGravarRegras(regras); closeModal(); render(); toast("Etapa salva.");
}
function fuExcluirRegra(id){
  if(!podeAdmin()) return;
  if(!confirm("Excluir esta etapa? O histórico de envios dela continua guardado.")) return;
  fuGravarRegras(fuCfg().regras.filter(r=>r.id!==id)); closeModal(); render(); toast("Etapa excluída.");
}

  const pend=fuPendentes(); const agora=pend.hoje.concat(pend.seguros).filter(e=>e.cliente.id===c.id);

    <div style="padding:12px 16px">
      ${c.optout?`<p class="muted" style="font-size:12.5px;margin:0 0 10px">Fora da régua por pedido do cliente. Para mudar, edite o cadastro.</p>`:""}
      ${agora.map(e=>`<div class="kv"><span class="k"><span class="chip ${e.libera?"neutral":"accent"}">${e.libera?"libera "+e.libera.toLocaleDateString("pt-BR"):"agora"}</span> ${escFila(e.regra.nome)}</span>
          <span class="v"><button class="btn sm ${e.libera?"":"wa"}" onclick="fuRevisar('${e.id}')">${e.libera?"Enviar já":"Enviar"}</button></span></div>`).join("")}
      ${prox.map(e=>`<div class="kv"><span class="k">${escFila(e.regra.nome)}</span><span class="v">${e.due.toLocaleDateString("pt-BR")}</span></div>`).join("")}
      ${!c.optout && !agora.length && !prox.length?`<p class="muted" style="font-size:12.5px;margin:0 0 6px">Nenhuma etapa prevista para este cliente.</p>`:""}
      ${hist.length?`<div class="timeline" style="margin-top:12px">${hist.map(f=>`<div class="ev">
          <div class="d">${fmtDate(f.feitoEm)} · ${f.status==="enviado"?"enviado":"pulado"}${f.por?" por "+escFila(f.por):""}</div>
          <div class="b">${escFila(fuNomeRegra(f.regra))}</div></div>`).join("")}</div>`:""}
    </div></div>`;
}

function exportJSON(){ downloadFile(JSON.stringify(DB,null,2),"backup-crm-otica.json","application/json"); }
function exportCSV(){
  const rows=[["Nome","Telefone","Email","Nascimento","Tags","Total gasto","Compras","Última compra"]];
  DB.clientes.forEach(c=>{ const info=recompraInfo(c); const compras=DB.negocios.filter(n=>n.clienteId===c.id&&n.etapa==="ganho");
    rows.push([c.nome,c.telefone,c.email,c.nascimento,c.tags.join(" "),compras.reduce((s,n)=>s+n.valor,0),compras.length,info.ultima||""]); });
  downloadFile(rows.map(r=>r.map(x=>`"${(x??'').toString().replace(/"/g,'""')}"`).join(",")).join("\n"),"clientes.csv","text/csv");

function downloadFile(content,name,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
/* Importar agora escreve no banco compartilhado, não no navegador de quem
   clicou. Por isso é só do admin e avisa o tamanho do que vai subir: é a
   mesma rotina que leva os dados antigos do localStorage para o D1. */
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  if(!podeAdmin()){ toast("Só o administrador pode importar dados."); e.target.value=""; return; }
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{ data=JSON.parse(r.result); }catch(err){ toast("Arquivo inválido."); return; }
    if(!data || !Array.isArray(data.clientes)){ toast("Arquivo inválido: não parece um backup do Íris."); return; }
    const conta=(k)=>Array.isArray(data[k])?data[k].length:0;
    const total=["clientes","receitas","produtos","negocios","tarefas","os","parcelas","followups"].reduce((s,k)=>s+conta(k),0);
    if(!confirm(`Enviar ${total} registros para o banco da loja?\n\n`+
      `${conta("clientes")} clientes · ${conta("receitas")} receitas · ${conta("produtos")} produtos\n`+
      `${conta("negocios")} negócios · ${conta("tarefas")} tarefas · ${conta("os")} OS · ${conta("parcelas")} parcelas`+
      (conta("followups")?` · ${conta("followups")} registros de follow-up`:"")+`\n\n`+
      `Registros com o mesmo código serão sobrescritos. Nada é apagado.`)) return;
    importarParaOBanco(data, total);
  };
  r.readAsText(f);
}
async function popularExemplo(){
  if(!podeAdmin()){ toast("Só o administrador pode fazer isso."); return; }
  if(!bancoVazioNaLoja()){ toast("A base já tem registros. O exemplo só entra em base vazia."); return; }
  if(!confirm("Preencher o banco da loja com clientes e vendas de exemplo?\n\nSão dados fictícios, para você conhecer o sistema. Dá para excluí-los depois.")) return;
  const demo=seed();
  const chaves=["clientes","receitas","produtos","negocios","tarefas","os","parcelas"];
  await importarParaOBanco(demo, chaves.reduce((s,k)=>s+demo[k].length,0));
}

async function importarParaOBanco(data, total){
  // followups por último: cada registro aponta para um cliente que precisa já existir.
  const chaves=["clientes","receitas","produtos","negocios","tarefas","os","parcelas","followups"];
  // Em lotes: um arquivo grande numa requisição só estoura o limite de
  // tamanho do corpo e o de instruções por transação do D1.
  const LOTE=150;
  try{
    for(const k of chaves){
      const lista=Array.isArray(data[k])?data[k]:[];
      for(let i=0;i<lista.length;i+=LOTE){
        await api({acao:"gravar", mudancas:{ [k]: lista.slice(i,i+LOTE) }});
      }
    }
    if(data.config) await api({acao:"gravar", mudancas:{config:data.config}});
    await carregarDados(); render();
    toast(`Backup importado: ${total} registros no banco da loja.`);
  }catch(err){
    toast("Falha ao importar: "+(err.message||"erro desconhecido"));
  }
}

function onChangeCliNeg(){ const cid=$("#ngCli").value; const rxOpts=DB.receitas.filter(r=>r.clienteId===cid);
  const wrap=$("#ngRxWrap"); wrap.style.display=rxOpts.length?"":"none";
  $("#ngRx").innerHTML=`<option value="">Nenhuma</option>`+rxOpts.map(r=>`<option value="${r.id}">${r.tipo} · ${fmtDate(r.data)}</option>`).join(""); }
function addItem(){ const pid=$("#ngProd").value; const p=produto(pid); if(!p)return;
  const ex=tmpItens.find(i=>i.produtoId===pid); if(ex) ex.qtd++; else tmpItens.push({produtoId:pid,qtd:1,preco:p.preco}); renderItens(); }
function renderItens(){
  const body=$("#ngItens"); if(!body)return;
  body.innerHTML=tmpItens.map((i,idx)=>{ const p=produto(i.produtoId);
    return `<tr><td>${p?p.nome:'—'}</td>
      <td style="width:70px"><input type="number" min="1" value="${i.qtd}" onchange="tmpItens[${idx}].qtd=+this.value||1;renderItens()" style="width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:center"></td>
      <td style="width:120px"><input type="number" value="${i.preco}" onchange="tmpItens[${idx}].preco=+this.value||0;renderItens()" style="width:100px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"></td>
      <td style="text-align:right;width:100px" class="num strong">${brl(i.preco*i.qtd)}</td>
      <td style="width:30px"><button class="btn ghost sm" onclick="tmpItens.splice(${idx},1);renderItens()">×</button></td></tr>`; }).join("")
    || `<tr><td colspan="5" class="muted" style="text-align:center;padding:10px">Nenhum item. O valor pode ficar em branco em negócios iniciais.</td></tr>`;
  $("#ngTotal").textContent=brl(tmpItens.reduce((s,i)=>s+i.preco*i.qtd,0));
}
function salvarNegocio(id){
  const cid=$("#ngCli").value; if(!cid){ toast("Selecione o cliente."); return; }
  const titulo=$("#ngTit").value.trim()||"Novo negócio";
  const etapa=$("#ngEtapa").value;
  const dados={clienteId:cid,titulo,etapa,origem:$("#ngOrig").value,prioridade:$("#ngPrio").value,
    receitaId:$("#ngRx")?.value||null,itens:tmpItens.slice(),valor:tmpItens.reduce((s,i)=>s+i.preco*i.qtd,0),
    atualizadoEm:new Date().toISOString().slice(0,10)};
  let reg;
  if(id){ const n=DB.negocios.find(x=>x.id===id); const eraGanho=n.etapa==="ganho";
    const virandoGanho = etapa==="ganho" && !eraGanho;
    Object.assign(n,dados); reg=n;
    if(virandoGanho){ n.etapa=eraGanho?"ganho":dados.etapa; salvar({negocios:[n]}); closeModal(); return modalFecharVenda(id); }
  } else { const novo={id:uid(),criadoEm:new Date().toISOString().slice(0,10),...dados}; DB.negocios.push(novo); reg=novo;
    if(etapa==="ganho"){ salvar({negocios:[novo]}); closeModal(); return modalFecharVenda(novo.id); } }
  salvar({negocios:[reg]}); closeModal(); render(); toast("Negócio salvo.");
}
function excluirNegocio(id){
  if(!podeAdmin()){ toast("Só o administrador pode excluir registros."); return; }
  DB.negocios=DB.negocios.filter(n=>n.id!==id);
  DB.os=DB.os.filter(o=>o.negocioId!==id); DB.parcelas=DB.parcelas.filter(p=>p.negocioId!==id);
  salvar({_remover:{negocios:[id]}}); closeModal(); render(); toast("Negócio excluído."); }
function perderNegocio(id){ const n=DB.negocios.find(x=>x.id===id); n.etapa="perdido"; n.fechadoEm=new Date().toISOString().slice(0,10); salvar({negocios:[n]}); closeModal(); render(); toast("Negócio marcado como perdido."); }

  openModal(`<div class="modal wide"><div class="modal-h"><h3>Fechar venda · ${c?c.nome:''}</h3><button class="close-x" onclick="closeModal()">×</button></div>

        <div class="field"><label>1º vencimento</label><input id="fvVenc" type="date" value="${hoje}" onchange="fvPreview()"></div>
      </div>
      <div id="fvPrev" class="muted" style="font-size:12.5px;margin:-4px 0 16px"></div>

      <h4 style="margin:0 0 10px;font-size:13px">Ordem de serviço</h4>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px">
        <input type="checkbox" id="fvTemOS" ${temLente?'checked':''} onchange="fvToggle()"> Enviar para laboratório
      </label>
      <div id="fvOSbox" class="frow">
        <div class="field"><label>Laboratório</label><select id="fvLab">${(DB.config.laboratorios||[]).map(l=>`<option>${l}</option>`).join("")}</select></div>

      </div>

    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarVenda('${nid}')">Confirmar venda</button></div></div>`);
  window._fvValor = n.valor;
  fvToggle();
}
function fvToggle(){
  const forma=$("#fvForma").value;
  const qtd=$("#fvQtd");
  if(forma==="À vista"){ qtd.value=1; qtd.disabled=true; } else { qtd.disabled=false; if(+qtd.value<2) qtd.value=3; }
  $("#fvOSbox").style.display = $("#fvTemOS").checked? "grid":"none";
  fvPreview();
}
function fvPreview(){
  const n=+$("#fvQtd").value||1; const box=$("#fvPrev"); if(!box) return;
  const val=window._fvValor||0;
  const p=Math.round(val/n*100)/100;
  box.textContent = n===1? `Parcela única de ${brl(val)}, quitada na confirmação.`
    : `${n} parcelas de ${brl(p)}, mensais a partir do 1º vencimento.`;
}
function confirmarVenda(nid){
  const n=DB.negocios.find(x=>x.id===nid); if(!n) return;
  const forma=$("#fvForma").value, qtd=Math.max(1,+$("#fvQtd").value||1), venc=$("#fvVenc").value;
  const hoje=new Date().toISOString().slice(0,10);
  n.etapa="ganho"; n.atualizadoEm=hoje;
  const tocado = ganharNegocio(n);                    // estoque + tarefa de pós-venda
  // parcelas
  const novasParcelas=[];
  const val=Math.round(n.valor/qtd*100)/100;
  for(let k=0;k<qtd;k++){
    const vc=d(venc)||new Date(); const dt=new Date(vc); dt.setMonth(dt.getMonth()+k);
    const p={id:uid(),negocioId:n.id,clienteId:n.clienteId,n:k+1,total:qtd,valor:val,
      venceEm:dt.toISOString().slice(0,10), pagoEm: (forma==="À vista"||(forma==="Cartão"&&k===0&&qtd===1))?hoje:null, forma};
    DB.parcelas.push(p); novasParcelas.push(p);
  }
  // ordem de serviço
  const novasOS=[];
  if($("#fvTemOS").checked){
    const num=(DB.os.reduce((m,o)=>Math.max(m,o.numero||1000),1000))+1;
    const o={id:uid(),negocioId:n.id,clienteId:n.clienteId,numero:num,status:"aguardando",
      laboratorio:$("#fvLab").value,enviadoEm:null,previsaoEm:$("#fvPrevData").value,chegouEm:null,entregueEm:null,obs:""};
    DB.os.push(o); novasOS.push(o);
  }
  // Uma gravação só, com tudo que a venda produziu: negócio, pós-venda,
  // OS, parcelas e baixa de estoque. O servidor aceita as cinco partes do
  // vendedor — parcela nova e movimento de estoque são o trabalho dele.
  salvar({ negocios:[n], tarefas:tocado.tarefas, os:novasOS,
           produtos:tocado.produtos, parcelas:novasParcelas });
  closeModal(); render();
  toast("Venda fechada. " + ($("#fvTemOS")?.checked?"OS criada, ":"") + "pós-venda agendado.");
}

/* --- Oficina: acompanhamento das ordens de serviço --- */
function renderOficina(app){
  const abertas=DB.os.filter(o=>o.status!=="entregue");
  const atrasadas=abertas.filter(o=>o.previsaoEm && d(o.previsaoEm)<today() && o.status!=="pronto");
  setHeader("Oficina", `${abertas.length} ordens em andamento${atrasadas.length?` · <b style="color:var(--alert)">${atrasadas.length} atrasadas no laboratório</b>`:''}`,'');
  app.innerHTML=`<div class="board-wrap"><div class="board">${OS_STATUS.map(st=>{
    const list=DB.os.filter(o=>o.status===st.id)
      .sort((a,b)=>(a.previsaoEm||'')<(b.previsaoEm||'')?-1:1)
      .slice(0, st.id==="entregue"?12:99);
    return `<div class="col${_colRecebeu===st.id?' received':''}">
      <div class="col-h"><span class="stg" style="background:${st.cor}"></span><b>${st.nome}</b>
        <span class="c num">${DB.os.filter(o=>o.status===st.id).length}</span>
        <span class="sum">${st.id==="entregue"?"últimas 12":"&nbsp;"}</span></div>
      <div class="col-body">${list.map(o=>osCard(o)).join("")||'<div class="muted" style="font-size:12px;padding:10px;text-align:center">—</div>'}</div>
    </div>`;}).join("")}</div><button class="board-mais" onclick="rolarBoard(this)"></button></div>`;
  marcarBordas();
  _movido=null; _colRecebeu=null;
}
function osCard(o){
  const c=cliente(o.clienteId); const n=DB.negocios.find(x=>x.id===o.negocioId);
  const dias=o.previsaoEm? daysUntil(d(o.previsaoEm)):null;
  const atrasada = dias!==null && dias<0 && !["pronto","entregue"].includes(o.status);
  const idx=OS_STATUS.findIndex(s=>s.id===o.status);
  const prox=OS_STATUS[idx+1];
  return `<div class="deal${_movido===o.id?' landed':''}" style="cursor:default">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="chip neutral" style="font-size:10.5px">OS ${o.numero}</span>
      ${atrasada?`<span class="chip alert" style="font-size:10.5px">${Math.abs(dias)}d atrasada</span>`
        :dias!==null&&dias>=0&&o.status!=="entregue"?`<span class="chip ${dias<=1?'warn':'neutral'}" style="font-size:10.5px">chega em ${dias}d</span>`:''}
    </div>
    <div class="t" style="margin-top:5px">${c?c.nome:'—'}</div>
    <div class="cl">${n?n.titulo:''} · ${o.laboratorio||'—'}</div>
    <div class="meta">
      ${prox?`<button class="btn sm" onclick="avancarOS('${o.id}')">→ ${prox.nome}</button>`:''}
      ${o.status==="pronto"&&c?`<a class="btn wa sm" target="_blank" href="${waLink(c.telefone,`Boa notícia, ${c.nome.split(' ')[0]}! Seu óculos já chegou e está pronto para retirada na ${DB.config.nome}. Te esperamos!`)}">Avisar</a>`:''}
    </div></div>`;
}
function avancarOS(id){
  const o=DB.os.find(x=>x.id===id); if(!o) return;
  const idx=OS_STATUS.findIndex(s=>s.id===o.status); const prox=OS_STATUS[idx+1]; if(!prox) return;
  const hoje=new Date().toISOString().slice(0,10);
  o.status=prox.id;
  if(prox.id==="lab") o.enviadoEm=hoje;
  if(prox.id==="chegou") o.chegouEm=hoje;
  const novasTarefas=[];
  if(prox.id==="pronto"){                     // avisar o cliente vira tarefa, não boa intenção
    const t={id:uid(),clienteId:o.clienteId,negocioId:o.negocioId,
      titulo:"Avisar que o óculos chegou (OS "+o.numero+")",tipo:"whatsapp",venceEm:hoje,feito:false};
    DB.tarefas.push(t); novasTarefas.push(t);
  }
  if(prox.id==="entregue") o.entregueEm=hoje;
  _movido=o.id; _colRecebeu=prox.id;
  salvar({os:[o], tarefas:novasTarefas}); render(); toast("OS "+o.numero+" → "+prox.nome+".");
}

/* --- Financeiro: crediário e cobrança --- */
function renderFinanceiro(app){
  const atras=parcelasAtrasadas(), abertas=parcelasAbertas();
  setHeader("Financeiro", "", "");
  const hoje=today();
  const prox30=abertas.filter(p=>{const x=d(p.venceEm);return x>=hoje && daysUntil(x)<=30;});
  const linha=(p)=>{ const c=cliente(p.clienteId); const venc=d(p.venceEm)<hoje;
    const dias=Math.abs(daysUntil(d(p.venceEm)));
    return `<tr>
      <td class="row-click" onclick="abrirCliente('${p.clienteId}')"><div class="who"><div class="avatar">${c?initials(c.nome):'?'}</div>
        <div><div class="strong">${c?c.nome:'—'}</div><div class="muted" style="font-size:12px">${p.forma} · parcela ${p.n}/${p.total}</div></div></div></td>
      <td class="num strong">${brl(p.valor)}</td>
      <td>${venc?`<span class="chip alert">${fmtDate(p.venceEm)} · ${dias}d</span>`:dataTxt(p.venceEm,false)}</td>
      <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end">
        ${c?`<a class="btn wa sm" target="_blank" href="${waLink(c.telefone, venc
            ? `Olá, ${c.nome.split(' ')[0]}! Passando para lembrar da parcela ${p.n}/${p.total} de ${brl(p.valor)}, vencida em ${fmtDate(p.venceEm)}. Se precisar, a gente combina o melhor jeito.\n\n${DB.config.nome}`
            : `Olá, ${c.nome.split(' ')[0]}! Lembrete da parcela ${p.n}/${p.total} de ${brl(p.valor)}, que vence em ${fmtDate(p.venceEm)}.\n\n${DB.config.nome}`)}">Cobrar</a>`:''}
        <button class="btn sm" onclick="receberParcela('${p.id}')">Receber</button></div></td></tr>`; };
  app.innerHTML=`
  <div class="grid kpis4" style="margin-bottom:16px">
    ${kpi("A receber", brlShort(aReceber()), `<span class="muted" style="font-size:12px">${abertas.length} parcelas</span>`)}
    ${kpi("Vencido", brlShort(atras.reduce((s,p)=>s+p.valor,0)), `<span class="delta ${atras.length?'down':'flat'}">${atras.length} em atraso</span>`)}
    ${kpi("Recebido no mês", brlShort(recebidoNoMes()), `<span class="muted" style="font-size:12px">${DB.parcelas.filter(p=>p.pagoEm&&mesKey(p.pagoEm)===curMonth()).length} baixas</span>`)}
    ${kpi("Vence em 30d", brlShort(prox30.reduce((s,p)=>s+p.valor,0)), `<span class="muted" style="font-size:12px">${prox30.length} parcelas</span>`)}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Em atraso</h3><span class="count">${atras.length}</span></div>
    ${atras.length?`<table class="resp"><thead><tr><th>Cliente</th><th>Valor</th><th>Venceu</th><th></th></tr></thead>
      <tbody>${atras.sort((a,b)=>a.venceEm<b.venceEm?-1:1).map(linha).join("")}</tbody></table>`
      :emptyBox('Nenhuma parcela em atraso.')}</div>
  <div class="card"><div class="card-h"><h3>A vencer</h3><span class="count">${abertas.length-atras.length}</span></div>
    ${abertas.length-atras.length?`<table class="resp"><thead><tr><th>Cliente</th><th>Valor</th><th>Vence</th><th></th></tr></thead>
      <tbody>${abertas.filter(p=>d(p.venceEm)>=hoje).sort((a,b)=>a.venceEm<b.venceEm?-1:1).map(linha).join("")}</tbody></table>`
      :emptyBox('Nada a vencer.')}</div>`;
}
function receberParcela(id){ const p=DB.parcelas.find(x=>x.id===id); if(!p)return;
  p.pagoEm=new Date().toISOString().slice(0,10); salvar({parcelas:[p]});
  sairLinha(event, ()=>{ render(); toast("Parcela recebida: "+brl(p.valor)+"."); }); }

/* A linha desaparece antes da lista se reorganizar: o usuário vê o que causou a mudança. */
function sairLinha(ev, depois){
  const tr = ev && ev.target && ev.target.closest ? ev.target.closest("tr") : null;
  if(!tr || reduzMovimento){ depois(); return; }
  tr.classList.add("leaving");
  setTimeout(depois, 130);
}

/* ---------- helpers UI ---------- */
function emptyBox(msg){ return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg><div>${msg}</div></div>`; }

/* ============================================================
   MIGRAÇÃO — do localStorage antigo para o banco da loja

   Quem já usava o Íris tem os dados guardados neste navegador, sob a
   chave iris_crm_v1. Pedir para a pessoa exportar um .json e importar
   de volta funciona, mas é um passo a mais para esquecer. O app acha
   sozinho e oferece — uma vez, só para o admin, e só se o banco da
   loja estiver vazio. Base com dados é base em uso: nunca despejar
   por cima.
   ============================================================ */
function dadosAntigosNoNavegador(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && Array.isArray(d.clientes) && d.clientes.length) ? d : null;
  }catch(e){ return null; }
}
function bancoVazioNaLoja(){
  return !DB.clientes.length && !DB.produtos.length && !DB.negocios.length;
}
async function migrarDoNavegador(){
  const antigo = dadosAntigosNoNavegador();
  if(!antigo){ toast("Nenhum dado antigo encontrado neste navegador."); return; }
  if(!podeAdmin()){ toast("Só o administrador pode migrar os dados."); return; }
  if(!bancoVazioNaLoja() &&
     !confirm("O banco da loja já tem registros. Migrar vai sobrescrever os que tiverem o mesmo código. Continuar?")) return;
  const chaves=["clientes","receitas","produtos","negocios","tarefas","os","parcelas"];
  const total=chaves.reduce((s,k)=>s+(Array.isArray(antigo[k])?antigo[k].length:0),0);
  if(!confirm(`Enviar ${total} registros deste navegador para o banco da loja?`)) return;
  await importarParaOBanco(antigo, total);
}
/* Oferecido na primeira vez em que um admin abre um banco vazio tendo
   dados antigos na máquina. A resposta fica guardada para não virar
   pergunta toda sessão. */
const MIG_K="iris_migracao_oferecida";
function talvezOferecerMigracao(){
  if(!podeAdmin() || !bancoVazioNaLoja()) return;
  if(!dadosAntigosNoNavegador()) return;
  let ja=null; try{ ja=localStorage.getItem(MIG_K); }catch(e){}
  if(ja) return;
  try{ localStorage.setItem(MIG_K,"1"); }catch(e){}
  setTimeout(()=>{
    if(confirm("Este navegador tem dados de uma versão anterior do Íris, e o banco da loja está vazio.\n\nQuer enviar esses dados para o banco agora?"))
      migrarDoNavegador();
    else
      toast("Tudo bem. Dá para fazer depois em Config → Backup & dados.");
  }, 600);
}

/* ============================================================
   Login e sessão
   ============================================================ */
function telaLogin(erro){
  document.querySelector(".app").style.display = "none";
  closeModal();
  const el = document.getElementById("loginRoot");
  el.style.display = "grid";
  el.innerHTML = `
    <form class="login-card" onsubmit="entrar(event)">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="3.4" fill="#fff"/></svg></div>
      <h2>Íris</h2>
      <div class="sub">Entre com seu usuário e senha</div>
      ${erro?`<div class="login-erro">${erro}</div>`:""}
      <div class="field"><label>Usuário</label>
        <input id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label>Senha</label>
        <input id="lgSenha" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" id="lgBtn" type="submit" style="width:100%;justify-content:center;margin-top:6px">Entrar</button>
    </form>`;
  const u = document.getElementById("lgUser"); if(u) u.focus();
}

async function entrar(ev){
  ev.preventDefault();
  const btn = document.getElementById("lgBtn");
  const usuario = document.getElementById("lgUser").value.trim();
  const senha = document.getElementById("lgSenha").value;
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const r = await api({ acao:"login", usuario, senha });
    SESSAO = { logado:true, nome:r.nome, papel:r.papel };
    document.getElementById("loginRoot").style.display = "none";
    document.querySelector(".app").style.display = "";
    await carregarDados();
    render();
    talvezOferecerMigracao();
  }catch(e){
    // Rede fora é um problema diferente de senha errada, e dizer "usuário
    // ou senha inválidos" para quem está sem internet manda a pessoa
    // trocar a senha à toa.
    const msg = (e && e.message && e.status) ? e.message
      : "Não foi possível falar com o servidor. Verifique a conexão.";
    telaLogin(msg);
  }
}

async function sair(){
  if(lerFila().length && !confirm("Ainda há alterações esperando para serem salvas. Sair mesmo assim?")) return;
  try{ await api({acao:"logout"}); }catch(e){}
  SESSAO = { logado:false, nome:"", papel:"vendedor" };
  DB = bancoVazio();
  try{ localStorage.removeItem(CACHE_K); }catch(e){}
  telaLogin();
}

/* ---------- boot ---------- */
async function boot(){
  initTema();
  initVidro();
  try{
    const r = await api({ acao:"eu" });
    if(r.logado){
      SESSAO = { logado:true, nome:r.nome, papel:r.papel };
      await carregarDados();
      document.querySelector(".app").style.display = "";
      render();
      talvezOferecerMigracao();
      return;
    }
    telaLogin();
  }catch(e){
    // Sem servidor: se houver cópia local E a pessoa já estava logada
    // antes, abrir em leitura é melhor que uma tela morta. Mas fica dito.
    const c = lerCache();
    if(c){
      DB = c; SESSAO = { logado:true, nome:"", papel:"vendedor" }; semRede = true;
      document.querySelector(".app").style.display = "";
      render(); marcarRede();
      toast("Sem conexão. Mostrando a última cópia salva neste aparelho.");
      return;
    }
    telaLogin("Não foi possível falar com o servidor. Verifique a conexão.");
  }
}
document.querySelector(".app").style.display = "none";
boot();
</script>
