<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Íris — CRM para Óticas</title>
<!--
  ÍRIS · CRM específico para óticas
  Arquivo único, sem dependências externas. Persistência local (localStorage).
  Pronto para deploy no Cloudflare Pages (basta subir este .html).
  Diferencial central: motor de RECOMPRA por validade de receita — o que um CRM
  genérico (Pipedrive) não modela, porque não sabe que a receita do cliente vence.
-->
<style>
  :root{
    color-scheme:light;
    --ink:#141b22;
    --ink-2:#3f4b56;
    --ink-3:#6b7885;
    --paper:#f1efe9;         /* plano de fundo — o nível mais "ao fundo" */
    --sunken:#e8e5dd;        /* recesso: colunas de kanban, trilhos */
    --surface:#ffffff;       /* nível 1: cartões, tabelas */
    --surface-2:#faf9f6;     /* hover / listras */
    --raised:#ffffff;        /* nível 2: cartões arrastáveis */
    --line:rgba(20,27,34,.12);
    --line-soft:rgba(20,27,34,.07);
    --accent:#0d6e6b;
    --accent-ink:#0a4f4d;
    --accent-wash:#e5f0ef;
    --ok:#2d8a4e;  --ok-wash:#e6f2ea;
    --warn:#b3760a;--warn-wash:#fbf0dc;
    --alert:#c0392b;--alert-wash:#fbe9e7;
    /* Escala de elevação: a distância do plano de fundo carrega significado */
    --e0:inset 0 1px 2px rgba(20,27,34,.06);
    --e1:0 1px 2px rgba(20,27,34,.05), 0 2px 6px rgba(20,27,34,.045);
    --e2:0 2px 4px rgba(20,27,34,.06), 0 8px 20px rgba(20,27,34,.08);
    --e3:0 12px 24px rgba(20,27,34,.12), 0 32px 64px rgba(20,27,34,.18);
    --shadow:var(--e1);
    --radius:12px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Motion: curvas únicas, duração curta — movimento que explica, não que enfeita */
    --ease:cubic-bezier(.2,.7,.3,1);
    --fast:120ms; --mid:220ms;
    --side-bg:#141b22; --side-ink:#aeb9c2; --side-hi:#eef2f5;
    --topbar:rgba(241,239,233,.85);
    --chip-neutral:rgba(20,27,34,.06);
  }
  /* Tema escuro construído do zero, não invertido: neutros quentes, acento clareado
     para manter contraste AA sobre superfície escura. */
  [data-theme="dark"]{
    color-scheme:dark;
    --ink:#e8eaec;
    --ink-2:#b3bcc4;
    --ink-3:#85939d;
    --paper:#12161a;
    --sunken:#0d1114;
    --surface:#1a2026;
    --surface-2:#212930;
    --raised:#232b33;
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.06);
    --accent:#2fa8a2;
    --accent-ink:#7fd4cf;
    --accent-wash:rgba(47,168,162,.16);
    --ok:#4cb972;  --ok-wash:rgba(76,185,114,.16);
    --warn:#d99b2b; --warn-wash:rgba(217,155,43,.16);
    --alert:#e4695a; --alert-wash:rgba(228,105,90,.16);
    --e0:inset 0 1px 2px rgba(0,0,0,.4);
    --e1:0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25);
    --e2:0 2px 4px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
    --e3:0 12px 24px rgba(0,0,0,.5), 0 32px 64px rgba(0,0,0,.6);
    --side-bg:#0b0e11; --side-ink:#93a0a9; --side-hi:#e8eaec;
    --topbar:rgba(18,22,26,.85);
    --chip-neutral:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--accent-ink)}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--paper)}

  /* ---------- Shell ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
  .side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;color:#fff}
  .brand .mark{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(150deg,var(--accent),#12908c);display:grid;place-items:center}
  .brand .mark svg{width:18px;height:18px}
  .brand b{font-size:16px;letter-spacing:.2px}
  .brand small{display:block;color:var(--side-ink);opacity:.8;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--side-ink);padding:9px 10px;border-radius:9px;
    font-size:13.5px;font-weight:500;transition:background .12s,color .12s
  }
  .nav button:hover{background:rgba(255,255,255,.06);color:var(--side-hi)}
  .nav button.active{background:var(--accent);color:#fff}
  .nav button .ic{width:17px;height:17px;flex:none;opacity:.92}
  .nav .badge{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
  .nav button.active .badge{background:rgba(255,255,255,.24)}
  .side-foot{margin-top:auto;font-size:11px;color:var(--ink-3);line-height:1.5;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.06)}

  .main{overflow:auto;display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .content{padding:22px 26px 60px;max-width:1280px;width:100%}

  /* ---------- Buttons / chips ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.12s}
  .btn:hover{border-color:rgba(20,27,34,.28);box-shadow:var(--shadow)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--surface-2);box-shadow:none}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
  .btn.wa{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
  .btn.wa:hover{filter:brightness(.96)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.01em}
  .chip.ok{background:var(--ok-wash);color:var(--ok)}
  .chip.warn{background:var(--warn-wash);color:var(--warn)}
  .chip.alert{background:var(--alert-wash);color:var(--alert)}
  .chip.neutral{background:var(--chip-neutral);color:var(--ink-2)}
  .chip.accent{background:var(--accent-wash);color:var(--accent-ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* ---------- Cards / grid ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--e1)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .card-h h3{margin:0;font-size:14px;letter-spacing:.01em}
  .card-h .count{color:var(--ink-3);font-size:12.5px;font-weight:600}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--e1)}
  .kpi .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--ink-3)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:4px}
  .kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--alert)} .kpi .delta.flat{color:var(--ink-3)}

  /* ---------- Tables ---------- */
  /* ---------- Motion como linguagem de estado ----------
     Regra: só anima o que comunica causa e efeito. Nada decorativo. */
  @keyframes settle{ from{transform:translateY(-6px) scale(.985);opacity:.5} to{transform:none;opacity:1} }
  @keyframes pulseCol{ 0%{box-shadow:inset 0 0 0 2px var(--accent)} 100%{box-shadow:var(--e0)} }
  @keyframes leaveRow{ to{opacity:0;transform:translateX(10px)} }
  @keyframes riseIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .deal.landed{animation:settle var(--mid) var(--ease)}          /* cartão que acabou de mudar de etapa */
  .col.received{animation:pulseCol 600ms var(--ease)}            /* coluna que recebeu o cartão */
  .leaving{animation:leaveRow var(--fast) var(--ease) forwards}  /* linha baixada/concluída */
  .content>*{animation:riseIn var(--mid) var(--ease)}
  /* Alvo de drop "atrai" o cartão: a coluna cresce levemente sob o cursor */
  .col{transition:transform var(--fast) var(--ease),background var(--fast) var(--ease)}
  .col.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-wash);transform:scale(1.015)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:var(--mid)}

  .theme-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
  .theme-btn:hover{box-shadow:var(--e1)}

  /* ---------- Bento: módulos assimétricos, densidade sem sobrecarga ---------- */
  .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:start}
  .bento>*{min-width:0}
  .b7{grid-column:span 7} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b4{grid-column:span 4} .b3{grid-column:span 3}
  .b-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1100px){ .bento>*{grid-column:span 12} }

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    font-weight:700;padding:9px 16px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface)}
  td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--surface-2)}
  .row-click{cursor:pointer}
  .muted{color:var(--ink-3)}
  .strong{font-weight:600}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .who{display:flex;align-items:center;gap:10px}

  /* ---------- Kanban ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
  .col{flex:none;width:270px;background:var(--sunken);box-shadow:var(--e0);border:1px solid var(--line-soft);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
  .col-h{padding:11px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft)}
  .col-h .stg{width:9px;height:9px;border-radius:3px;flex:none}
  .col-h b{font-size:12.5px;letter-spacing:.01em}
  .col-h .c{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:700}
  .col-h .sum{width:100%;flex-basis:100%;font-size:11px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
  .col-body{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
  .deal{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:var(--e1);cursor:grab;
    transition:box-shadow var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .deal:hover{box-shadow:var(--e2);transform:translateY(-1px)}
  .deal:active{cursor:grabbing}
  .deal.drag{opacity:.4}
  .deal .t{font-weight:600;font-size:13px;line-height:1.3}
  .deal .cl{color:var(--ink-3);font-size:12px;margin-top:2px}
  .deal .meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .deal .v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
  .flag{width:6px;border-radius:6px;align-self:stretch}

  /* ---------- Detail (cliente 360) ---------- */
  .detail{display:grid;grid-template-columns:320px 1fr;gap:16px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-3)}
  .kv .v{font-weight:600;text-align:right}
  .rx{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px}
  .rx table{font-size:12.5px}
  .rx th,.rx td{padding:5px 8px;border:0;text-align:center;background:transparent;position:static}
  .rx th{text-transform:none;letter-spacing:0;font-size:11px}
  .rx .lens-row td:first-child{text-align:left;font-weight:700;color:var(--ink-2)}
  .timeline{position:relative;padding-left:18px}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;padding:0 0 14px 6px}
  .ev:before{content:"";position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .ev .d{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .ev .b{font-size:13px;margin-top:1px}

  /* ---------- Recompra ---------- */
  .radar-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
  .radar-legend span{display:inline-flex;align-items:center;gap:6px}
  .bar{height:6px;border-radius:6px;background:var(--sunken);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px}

  /* ---------- Charts ---------- */
  .chartwrap{padding:16px}
  .funnel-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .funnel-row .lb{width:150px;font-size:12.5px;color:var(--ink-2);flex:none}
  .funnel-row .track{flex:1;height:22px;background:var(--sunken);box-shadow:var(--e0);border-radius:6px;overflow:hidden}
  .funnel-row .track>i{display:block;height:100%;background:var(--accent);opacity:.85;border-radius:6px}
  .funnel-row .n{width:104px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}

  /* ---------- Forms / modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,27,34,.42);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px}
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--e3);width:100%;max-width:560px;max-height:90vh;overflow:auto}
  .modal.wide{max-width:720px}
  .modal-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-soft);z-index:2}
  .modal-h h3{margin:0;font-size:16px}
  .modal-b{padding:18px 20px}
  .modal-f{position:sticky;bottom:0;background:var(--surface);padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-wash);border-color:var(--accent)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .frow-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .rx-grid td input{padding:6px 7px;text-align:center}
  .items-tbl td{padding:6px 8px;border-bottom:1px solid var(--line-soft)}
  .close-x{margin-left:auto;background:transparent;border:0;font-size:22px;color:var(--ink-3);line-height:1;padding:0 4px}

  .empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
  .empty svg{width:38px;height:38px;opacity:.5;margin-bottom:10px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line-soft)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--side-bg);color:var(--side-hi);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:200;opacity:0;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media (max-width:960px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:-260px;top:0;bottom:0;width:232px;z-index:60;transition:left .2s}
    .side.open{left:0}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .detail{grid-template-columns:1fr}
    .menu-btn{display:inline-flex}
  }
  @media (min-width:961px){.menu-btn{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="3.4" fill="#fff"/></svg></div>
      <div><b id="brandName">Íris</b><small>CRM · Ótica</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Dados salvos neste dispositivo (LGPD-friendly).<br>Backup em <b>Config → Exportar</b>.
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="btn ghost menu-btn" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Painel</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="pageActions" style="display:flex;gap:10px;flex-wrap:wrap"></div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTema()" title="Alternar tema" aria-label="Alternar tema"></button>
    </div>
    <div class="content" id="app"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ÍRIS CRM — núcleo de dados
   ============================================================ */
const KEY = "iris_crm_v1";
const STAGES = [
  {id:"novo",     nome:"Novo contato",      cor:"#6b7885"},
  {id:"exame",    nome:"Exame agendado",    cor:"#8e6bd6"},
  {id:"receita",  nome:"Receita em mãos",   cor:"#0d6e6b"},
  {id:"escolha",  nome:"Escolhendo produto",cor:"#2f7fd1"},
  {id:"orcamento",nome:"Orçamento enviado", cor:"#b3760a"},
  {id:"ganho",    nome:"Venda fechada",     cor:"#2d8a4e"},
];
const CATS = ["Armação","Lente","Solar","Acessório","Serviço"];

function daysUntil(dateObj){ if(!dateObj) return null; return Math.round((dateObj - today())/86400000); }

/* ---------- Lógica de recompra (o coração do sistema) ---------- */
// Para cada cliente calcula: última compra, receita vigente, status de recompra.
function recompraInfo(c){
  const ganhos = DB.negocios.filter(n=>n.clienteId===c.id && n.etapa==="ganho");
  const ultima = ganhos.map(g=>g.fechadoEm||g.atualizadoEm).sort().pop() || null;
  const rxs = DB.receitas.filter(r=>r.clienteId===c.id).sort((a,b)=> a.data<b.data?1:-1);
  const rx = rxs[0] || null;
  const rxVenc = rx ? addMonths(rx.data, rx.validadeMeses) : null;
  const diasRx = rxVenc ? daysUntil(rxVenc) : null;               // <0 vencida
  const mesesCompra = ultima ? monthsAgo(ultima) : null;
  const ciclo = DB.config.cicloRecompraMeses;

  let status="ok", motivo="", score=0;
  if(diasRx!==null && diasRx < 0){ status="alert"; motivo="Receita vencida há "+Math.abs(diasRx)+"d"; score=100+Math.abs(diasRx); }
  else if(diasRx!==null && diasRx <= 60){ status="warn"; motivo="Receita vence em "+diasRx+"d"; score=60-diasRx+40; }
  else if(mesesCompra!==null && mesesCompra >= ciclo){ status="warn"; motivo="Última compra há "+Math.round(mesesCompra)+" meses"; score=Math.round(mesesCompra); }
  else if(mesesCompra!==null && mesesCompra >= ciclo*0.66){ status="soon"; motivo="Aproximando do ciclo ("+Math.round(mesesCompra)+"m)"; score=Math.round(mesesCompra)-5; }
  return {ultima,rx,rxVenc,diasRx,mesesCompra,status,motivo,score};
}
function recompraList(){
  return DB.clientes.map(c=>({c,info:recompraInfo(c)}))
    .filter(x=> x.info.status==="alert"||x.info.status==="warn"||x.info.status==="soon")
    .sort((a,b)=> b.info.score - a.info.score);
}
function aniversariantes(dias){
  dias = dias||30; const t=today();
  return DB.clientes.filter(c=>c.nascimento).map(c=>{
    const nb=d(c.nascimento); const prox=new Date(t.getFullYear(),nb.getMonth(),nb.getDate());
    if(prox<t) prox.setFullYear(t.getFullYear()+1);
    return {c,dias:Math.round((prox-t)/86400000),idade:t.getFullYear()-nb.getFullYear()};
  }).filter(x=>x.dias<=dias).sort((a,b)=>a.dias-b.dias);
}

function mesKey(s){ return s? s.slice(0,7):""; }
function curMonth(){ return new Date().toISOString().slice(0,7); }
function prevMonth(){ const t=new Date(); t.setDate(1); t.setMonth(t.getMonth()-1); return t.toISOString().slice(0,7); }
function vendasNoMes(mk){ return DB.negocios.filter(n=>n.etapa==="ganho" && mesKey(n.fechadoEm||n.atualizadoEm)===mk); }
function somaVendas(mk){ return vendasNoMes(mk).reduce((s,n)=>s+n.valor,0); }
function seriesUlt6(){
  const arr=[]; const t=new Date(); t.setDate(1);
  for(let i=5;i>=0;i--){ const dt=new Date(t.getFullYear(),t.getMonth()-i,1); const mk=dt.toISOString().slice(0,7);
    arr.push({mk,label:dt.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""),total:somaVendas(mk),qtd:vendasNoMes(mk).length}); }

  document.documentElement.setAttribute("data-theme",t);
  const b=$("#themeBtn");
  if(b) b.innerHTML = t==="dark"
    ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>`

}

  try{ localStorage.setItem(TKEY,t); }catch(e){}
  aplicarTema(t); }
function initTema(){
  let t=null; try{ t=localStorage.getItem(TKEY); }catch(e){}
  if(!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
  aplicarTema(t);
}

/* Transição entre telas: o navegador faz o cross-fade, comunicando que o
   contexto mudou sem quebrar a leitura. Degrada em silêncio onde não há suporte. */
const reduzMovimento = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function render(){
  if(document.startViewTransition && !reduzMovimento){ document.startViewTransition(()=>renderAgora()); }
  else renderAgora();
}
function renderAgora(){
  renderNav();
  aplicarTema(temaAtual());
  const app=$("#app");
  if(state.view==="painel") return renderPainel(app);
  if(state.view==="funil") return renderFunil(app);
  if(state.view==="oficina") return renderOficina(app);
  if(state.view==="financeiro") return renderFinanceiro(app);
  if(state.view==="clientes") return state.clienteSel?renderCliente360(app):renderClientes(app);
  if(state.view==="recompra") return renderRecompra(app);
  if(state.view==="produtos") return renderProdutos(app);
  if(state.view==="agenda") return renderAgenda(app);
  if(state.view==="config") return renderConfig(app);
}

function kpi(lbl,val,sub,link){
  const click = link? `onclick="go('${link}')" style="cursor:pointer"`:"";
  return `<div class="kpi" ${click}><div class="lbl">${lbl}</div><div class="val num">${val}</div>${sub||""}</div>`;
}
function barChart(serie,maxS){
  const meta=DB.config.metaMes||0;
  const top=Math.max(maxS, meta*1.05, 1);           // escala inclui a meta: linha nunca "achatada" no topo
  const W=100,gap=3,bw=(W-gap*(serie.length-1))/serie.length; const H=120;
  const metaY = H - (meta/top)*H;
  let bars=serie.map((s,i)=>{ const h=(s.total/top)*H; const x=i*(bw+gap);
    const isCur=i===serie.length-1;
    return `<rect x="${x}" y="${H-h}" width="${bw}" height="${Math.max(h,1)}" rx="1.5" fill="${isCur?'var(--accent)':'currentColor'}" ${isCur?'':'opacity=".35"'}/>`; }).join("");
  let labels=serie.map((s,i)=>{ const x=i*(bw+gap)+bw/2;
    return `<text x="${x}" y="${H+13}" font-size="4.4" text-anchor="middle" fill="currentColor" opacity=".65" font-weight="600">${s.label}</text>
            <text x="${x}" y="${H-(s.total/top)*H-2.5}" font-size="4" text-anchor="middle" fill="currentColor" font-weight="700">${s.total?brlShort(s.total).replace('R$ ',''):''}</text>`;}).join("");
  return `<svg viewBox="0 0 100 138" width="100%" style="overflow:visible">
    <line x1="0" y1="${metaY}" x2="100" y2="${metaY}" stroke="#c0392b" stroke-width="0.4" stroke-dasharray="1.5 1.5" opacity="0.7"/>
    <text x="100" y="${metaY-1.5}" font-size="3.6" text-anchor="end" fill="#c0392b" font-weight="700">meta ${brlShort(meta).replace('R$ ','')}</text>
    ${bars}${labels}</svg>`;
}
function funnelChart(){
  const open=STAGES.filter(s=>s.id!=="ganho");
  const rows=open.map(s=>{ const ds=DB.negocios.filter(n=>n.etapa===s.id); const val=ds.reduce((a,n)=>a+n.valor,0); return {s,n:ds.length,val}; });
  const maxN=Math.max(1,...rows.map(r=>r.n));
  return rows.map(r=>`<div class="funnel-row">
      <div class="lb"><span class="dot" style="background:${r.s.cor};display:inline-block;margin-right:6px"></span>${r.s.nome}</div>
      <div class="track"><i style="width:${r.n/maxN*100}%;background:${r.s.cor}"></i></div>
      <div class="n num">${r.n} · ${brlShort(r.val).replace('R$ ','R$')}</div></div>`).join("");
}
function recRow(x){

      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1012 2zm0 2a8 8 0 11-4.2 14.8l-.4-.2-2.8.8.8-2.7-.2-.4A8 8 0 0112 4z"/></svg></a></td>
  </tr>`;
}
function renderMiniTarefas(){
  const ts=tarefasPendentes().sort((a,b)=>a.venceEm<b.venceEm?-1:1).slice(0,6);
  if(!ts.length) return emptyBox("Sem tarefas pendentes. 🎯");
  return `<table><tbody>${ts.map(t=>{
    const c=cliente(t.clienteId); const vencida=d(t.venceEm)<today();
    return `<tr>
      <td style="width:26px"><input type="checkbox" onchange="concluirTarefa('${t.id}')"></td>
      <td><div class="strong">${t.titulo}</div><div class="muted" style="font-size:12px">${c?c.nome:'—'} · ${tarefaTipoLabel(t.tipo)}</div></td>
      <td style="text-align:right"><span class="chip ${vencida?'alert':'neutral'}">${fmtDate(t.venceEm)}</span></td>
    </tr>`; }).join("")}</tbody></table>`;
}

/* ---------------- FUNIL (Kanban) ---------------- */
let dragId=null;
let _movido=null, _colRecebeu=null;   // consumidos uma única vez pelo próximo render
function renderFunil(app){
  const total=pipelineAberto().reduce((s,n)=>s+n.valor,0);
  setHeader("Funil de vendas", `${pipelineAberto().length} negócios abertos · ${brl(total)} em pipeline`,
    `<button class="btn primary" onclick="modalNegocio()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Novo negócio</button>`);
  app.innerHTML=`<div class="board" id="board">${STAGES.map(s=>{
    const ds=DB.negocios.filter(n=>n.etapa===s.id).sort((a,b)=>a.atualizadoEm<b.atualizadoEm?1:-1);
    const val=ds.reduce((a,n)=>a+n.valor,0);
    return `<div class="col${_colRecebeu===s.id?' received':''}" data-stage="${s.id}"
       ondragover="event.preventDefault();this.classList.add('drop')"
       ondragleave="this.classList.remove('drop')"
       ondrop="dropDeal(event,'${s.id}')">
      <div class="col-h"><span class="stg" style="background:${s.cor}"></span><b>${s.nome}</b><span class="c num">${ds.length}</span>
        <span class="sum">${brl(val)}</span></div>
      <div class="col-body">${ds.map(dealCard).join("")||'<div class="muted" style="font-size:12px;padding:10px;text-align:center">—</div>'}</div>
    </div>`; }).join("")}</div>`;
  _movido=null; _colRecebeu=null;   // sinalizadores valem para um render só
}
function dealCard(n){
  const c=cliente(n.clienteId);
  const pr = n.prioridade==="alta"?"#c0392b":n.prioridade==="baixa"?"#b9c6c5":"#e0b23c";
  const rx = n.receitaId? DB.receitas.find(r=>r.id===n.receitaId):null;
  return `<div class="deal${_movido===n.id?' landed':''}" draggable="true" ondragstart="dragId='${n.id}';this.classList.add('drag')" ondragend="this.classList.remove('drag')" onclick="modalNegocio('${n.id}')">
    <div style="display:flex;gap:9px">
      <div class="flag" style="background:${pr}"></div>
      <div style="flex:1;min-width:0">
        <div class="t">${n.titulo}</div>
        <div class="cl">${c?c.nome:'—'}</div>
        <div class="meta">
          ${rx?`<span class="chip accent" style="font-size:10.5px">${rx.tipo}</span>`:""}
          ${n.origem?`<span class="chip neutral" style="font-size:10.5px">${n.origem}</span>`:""}
          <span class="v num">${brl(n.valor)}</span>
        </div>
      </div>
    </div></div>`;
}
function dropDeal(e,stg){
  e.preventDefault(); document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop'));
  const n=DB.negocios.find(x=>x.id===dragId); if(!n||n.etapa===stg) return;
  if(stg==="ganho" && n.etapa!=="ganho"){ modalFecharVenda(n.id); return; }  // exige pagamento e OS antes de fechar
  n.etapa=stg; n.atualizadoEm=new Date().toISOString().slice(0,10);
  _movido=n.id; _colRecebeu=stg;                 // motion: quem se moveu e para onde
  save(); render(); toast("Negócio movido para “"+stage(stg).nome+"”.");
}
function ganharNegocio(n){
  n.fechadoEm=new Date().toISOString().slice(0,10);
  n.garantiaMeses=n.garantiaMeses||12;
  // baixa de estoque
  n.itens.forEach(i=>{ const p=produto(i.produtoId); if(p&&typeof p.estoque==="number") p.estoque=Math.max(0,p.estoque-i.qtd); });
  // pós-venda automático de adaptação (15 dias)
  const rx = n.receitaId? DB.receitas.find(r=>r.id===n.receitaId):null;
  const multi = rx && /multifocal|bifocal|ocupacional/i.test(rx.tipo);
  const dt=new Date(); dt.setDate(dt.getDate()+ (multi?15:7));
  DB.tarefas.push({id:uid(),clienteId:n.clienteId,negocioId:n.id,
    titulo: multi?"Pós-venda 15d — adaptação multifocal":"Pós-venda — conferir adaptação",
    tipo:"posvenda",venceEm:dt.toISOString().slice(0,10),feito:false});
}

function rxCard(r){
  const venc=addMonths(r.data,r.validadeMeses); const dias=daysUntil(venc);
  const st=dias<0?`<span class="chip alert">Vencida</span>`:dias<=60?`<span class="chip warn">${dias}d p/ vencer</span>`:`<span class="chip ok">Vigente</span>`;
  const line=(lbl,o)=>`<tr class="lens-row"><td>${lbl}</td><td>${o.esf||'—'}</td><td>${o.cil||'—'}</td><td>${o.eixo||'—'}</td></tr>`;
  return `<div class="rx">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <b style="font-size:13px">${r.tipo}</b><span class="muted" style="font-size:12px">${fmtDate(r.data)}</span>${st}
      <button class="btn ghost sm" style="margin-left:auto" onclick="modalReceita('${r.id}')">editar</button></div>
    <table><thead><tr><th></th><th>Esf</th><th>Cil</th><th>Eixo</th></tr></thead>
      <tbody>${line('OD',r.od)}${line('OE',r.oe)}</tbody></table>
    <div class="muted" style="font-size:12px;margin-top:6px">${r.adicao?'Adição '+r.adicao+' · ':''}DP ${r.dp||'—'} · Val. ${r.validadeMeses}m · vence ${venc.toLocaleDateString('pt-BR')}</div>
  </div>`;
}

        <td class="num">${tk?brl(tk):'—'}</td>
        <td><div style="display:flex;gap:6px">

function msgRecompra(c,info){

}

    `<button class="btn primary" onclick="modalTarefa()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nova tarefa</button>`);

function tarefaTipoLabel(t){ return {ligacao:"Ligação",whatsapp:"WhatsApp",posvenda:"Pós-venda",recompra:"Recompra",geral:"Geral"}[t]||"Geral"; }
function toggleTarefa(id){ const t=DB.tarefas.find(x=>x.id===id); if(!t)return; t.feito=!t.feito; save(); render(); }
function concluirTarefa(id){ const t=DB.tarefas.find(x=>x.id===id); if(!t)return; t.feito=true; save();

function salvarConfig(){
  DB.config.nome=$("#cfNome").value||DB.config.nome;
  DB.config.metaMes=+$("#cfMeta").value||DB.config.metaMes;
  DB.config.ddi=onlyDigits($("#cfDdi").value)||"55";
  if($("#cfCiclo")) DB.config.cicloRecompraMeses=+$("#cfCiclo").value||18;
  if($("#cfVal")) DB.config.validadePadrao=+$("#cfVal").value||12;
  save(); render(); toast("Configurações salvas.");
}
function exportJSON(){ downloadFile(JSON.stringify(DB,null,2),"backup-crm-otica.json","application/json"); }
function exportCSV(){
  const rows=[["Nome","Telefone","Email","Nascimento","Tags","Total gasto","Compras","Última compra"]];
  DB.clientes.forEach(c=>{ const info=recompraInfo(c); const compras=DB.negocios.filter(n=>n.clienteId===c.id&&n.etapa==="ganho");
    rows.push([c.nome,c.telefone,c.email,c.nascimento,c.tags.join(" "),compras.reduce((s,n)=>s+n.valor,0),compras.length,info.ultima||""]); });
  downloadFile(rows.map(r=>r.map(x=>`"${(x??'').toString().replace(/"/g,'""')}"`).join(",")).join("\n"),"clientes.csv","text/csv");
}
function downloadFile(content,name,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function importJSON(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data.clientes) throw 0; DB=data; save(); render(); toast("Backup importado."); }catch(err){ toast("Arquivo inválido."); } }; r.readAsText(f); }
function resetDados(){ if(confirm("Isso apaga tudo e recarrega os dados de exemplo. Continuar?")){ localStorage.removeItem(KEY); DB=seed(); save(); state.clienteSel=null; render(); toast("Dados de exemplo restaurados."); } }

function salvarCliente(id){
  const nome=$("#clNome").value.trim(); if(!nome){ toast("Informe o nome."); return; }
  const dados={nome,telefone:$("#clTel").value.trim(),email:$("#clMail").value.trim(),nascimento:$("#clNasc").value,
    tags:$("#clTags").value.split(",").map(s=>s.trim()).filter(Boolean),obs:$("#clObs").value.trim()};
  if(id){ Object.assign(cliente(id),dados); } else { DB.clientes.push({id:uid(),criadoEm:new Date().toISOString().slice(0,10),...dados}); }
  save(); closeModal(); render(); toast("Cliente salvo.");
}
function excluirCliente(id){ if(!confirm("Excluir este cliente e seus dados?"))return;
  DB.clientes=DB.clientes.filter(c=>c.id!==id); DB.receitas=DB.receitas.filter(r=>r.clienteId!==id);
  DB.negocios=DB.negocios.filter(n=>n.clienteId!==id); DB.tarefas=DB.tarefas.filter(t=>t.clienteId!==id);
  DB.os=DB.os.filter(o=>o.clienteId!==id); DB.parcelas=DB.parcelas.filter(p=>p.clienteId!==id);
  save(); closeModal(); state.clienteSel=null; render(); toast("Cliente excluído.");
}

function modalReceita(id,clienteId){
  const r=id?DB.receitas.find(x=>x.id===id):{clienteId,data:new Date().toISOString().slice(0,10),tipo:"Visão simples",

  const lensInputs=(lado,o)=>`<tr><td style="text-align:left;font-weight:700;color:var(--ink-2);padding-right:8px">${lado}</td>
    <td><input id="rx_${lado}_esf" value="${o.esf||''}" placeholder="+0.00"></td>

    <div class="modal-b">
      <div class="frow"><div class="field"><label>Data</label><input id="rxData" type="date" value="${r.data}"></div>
        <div class="field"><label>Tipo</label><select id="rxTipo">${RX_TIPOS.map(t=>`<option ${r.tipo===t?'selected':''}>${t}</option>`).join("")}</select></div></div>
      <table class="rx-grid" style="margin:4px 0 12px"><thead><tr><th></th><th style="font-size:11px;color:var(--ink-3)">Esférico</th><th style="font-size:11px;color:var(--ink-3)">Cilíndrico</th><th style="font-size:11px;color:var(--ink-3)">Eixo</th></tr></thead>
        <tbody>${lensInputs('OD',r.od)}${lensInputs('OE',r.oe)}</tbody></table>
      <div class="frow-3"><div class="field"><label>Adição</label><input id="rxAd" value="${r.adicao||''}" placeholder="+2.00"></div>
        <div class="field"><label>DP</label><input id="rxDp" value="${r.dp||''}" placeholder="63"></div>
        <div class="field"><label>Validade (meses)</label><input id="rxVal" type="number" value="${r.validadeMeses}"></div></div>
      <div class="field"><label>Profissional / observações</label><input id="rxMed" value="${r.medico||''}"></div>
    </div>
    <div class="modal-f">${id?`<button class="btn" style="margin-right:auto;color:var(--alert)" onclick="excluirReceita('${id}')">Excluir</button>`:''}

      <button class="btn primary" onclick="salvarReceita('${id||''}','${cid}')">Salvar</button></div></div>`);
}
function salvarReceita(id,cid){
  const g=(s)=>$("#"+s).value.trim();
  const dados={clienteId:cid,data:$("#rxData").value,tipo:$("#rxTipo").value,
    od:{esf:g("rx_OD_esf"),cil:g("rx_OD_cil"),eixo:g("rx_OD_eixo")},
    oe:{esf:g("rx_OE_esf"),cil:g("rx_OE_cil"),eixo:g("rx_OE_eixo")},
    adicao:g("rxAd"),dp:g("rxDp"),validadeMeses:+$("#rxVal").value||12,medico:g("rxMed"),obs:""};
  if(id){ Object.assign(DB.receitas.find(x=>x.id===id),dados); } else { DB.receitas.push({id:uid(),...dados}); }
  save(); closeModal(); render(); toast("Receita salva.");
}
function excluirReceita(id){ DB.receitas=DB.receitas.filter(r=>r.id!==id); save(); closeModal(); render(); toast("Receita excluída."); }

/* ---- Negócio (com itens) ---- */
let tmpItens=[];
function modalNegocio(id,clienteId){
  const n=id?DB.negocios.find(x=>x.id===id):{titulo:"",clienteId:clienteId||"",etapa:"novo",itens:[],origem:"Balcão",prioridade:"media",receitaId:null};
  tmpItens=JSON.parse(JSON.stringify(n.itens||[]));
  const cid=n.clienteId;
  const rxOpts=cid?DB.receitas.filter(r=>r.clienteId===cid):[];
  openModal(`<div class="modal wide"><div class="modal-h"><h3>${id?'Editar negócio':'Novo negócio'}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="frow"><div class="field"><label>Cliente</label><select id="ngCli" onchange="onChangeCliNeg()">
        <option value="">— selecione —</option>${DB.clientes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${c.nome}</option>`).join("")}</select></div>
        <div class="field"><label>Título</label><input id="ngTit" value="${n.titulo}" placeholder="Ex.: Óculos multifocal"></div></div>
      <div class="frow-3">
        <div class="field"><label>Etapa</label><select id="ngEtapa">${STAGES.map(s=>`<option value="${s.id}" ${n.etapa===s.id?'selected':''}>${s.nome}</option>`).join("")}</select></div>
        <div class="field"><label>Origem</label><select id="ngOrig">${["Balcão","WhatsApp","Instagram","Indicação","Google","Recompra"].map(o=>`<option ${n.origem===o?'selected':''}>${o}</option>`).join("")}</select></div>
        <div class="field"><label>Prioridade</label><select id="ngPrio">${[["alta","Alta"],["media","Média"],["baixa","Baixa"]].map(p=>`<option value="${p[0]}" ${n.prioridade===p[0]?'selected':''}>${p[1]}</option>`).join("")}</select></div>
      </div>
      <div class="field" id="ngRxWrap" style="${rxOpts.length?'':'display:none'}"><label>Vincular receita</label>
        <select id="ngRx"><option value="">— nenhuma —</option>${rxOpts.map(r=>`<option value="${r.id}" ${n.receitaId===r.id?'selected':''}>${r.tipo} · ${fmtDate(r.data)}</option>`).join("")}</select></div>

      <div class="field"><label>Itens</label>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <select id="ngProd" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px">
            ${DB.produtos.map(p=>`<option value="${p.id}">${p.nome} — ${brl(p.preco)}</option>`).join("")}</select>
          <button class="btn" onclick="addItem()">Adicionar</button>
        </div>
        <table class="items-tbl"><tbody id="ngItens"></tbody></table>
        <div style="text-align:right;font-weight:700;margin-top:8px" class="num">Total: <span id="ngTotal">R$ 0,00</span></div>
      </div>
    </div>
    <div class="modal-f">${id?`<button class="btn" style="margin-right:auto;color:var(--alert)" onclick="excluirNegocio('${id}')">Excluir</button>`:''}
      ${id&&n.etapa!=='perdido'&&n.etapa!=='ganho'?`<button class="btn" onclick="perderNegocio('${id}')">Marcar perdido</button>`:''}
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="salvarNegocio('${id||''}')">Salvar</button></div></div>`);
  renderItens();
}
function onChangeCliNeg(){ const cid=$("#ngCli").value; const rxOpts=DB.receitas.filter(r=>r.clienteId===cid);
  const wrap=$("#ngRxWrap"); wrap.style.display=rxOpts.length?"":"none";
  $("#ngRx").innerHTML=`<option value="">— nenhuma —</option>`+rxOpts.map(r=>`<option value="${r.id}">${r.tipo} · ${fmtDate(r.data)}</option>`).join(""); }
function addItem(){ const pid=$("#ngProd").value; const p=produto(pid); if(!p)return;
  const ex=tmpItens.find(i=>i.produtoId===pid); if(ex) ex.qtd++; else tmpItens.push({produtoId:pid,qtd:1,preco:p.preco}); renderItens(); }
function renderItens(){
  const body=$("#ngItens"); if(!body)return;
  body.innerHTML=tmpItens.map((i,idx)=>{ const p=produto(i.produtoId);
    return `<tr><td>${p?p.nome:'—'}</td>
      <td style="width:70px"><input type="number" min="1" value="${i.qtd}" onchange="tmpItens[${idx}].qtd=+this.value||1;renderItens()" style="width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:center"></td>
      <td style="width:120px"><input type="number" value="${i.preco}" onchange="tmpItens[${idx}].preco=+this.value||0;renderItens()" style="width:100px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"></td>
      <td style="text-align:right;width:100px" class="num strong">${brl(i.preco*i.qtd)}</td>
      <td style="width:30px"><button class="btn ghost sm" onclick="tmpItens.splice(${idx},1);renderItens()">×</button></td></tr>`; }).join("")
    || `<tr><td colspan="5" class="muted" style="text-align:center;padding:10px">Nenhum item. O valor pode ficar em branco em negócios iniciais.</td></tr>`;
  $("#ngTotal").textContent=brl(tmpItens.reduce((s,i)=>s+i.preco*i.qtd,0));
}
function salvarNegocio(id){
  const cid=$("#ngCli").value; if(!cid){ toast("Selecione o cliente."); return; }
  const titulo=$("#ngTit").value.trim()||"Novo negócio";
  const etapa=$("#ngEtapa").value;
  const dados={clienteId:cid,titulo,etapa,origem:$("#ngOrig").value,prioridade:$("#ngPrio").value,
    receitaId:$("#ngRx")?.value||null,itens:tmpItens.slice(),valor:tmpItens.reduce((s,i)=>s+i.preco*i.qtd,0),
    atualizadoEm:new Date().toISOString().slice(0,10)};
  if(id){ const n=DB.negocios.find(x=>x.id===id); const eraGanho=n.etapa==="ganho";
    const virandoGanho = etapa==="ganho" && !eraGanho;
    Object.assign(n,dados);
    if(virandoGanho){ n.etapa=eraGanho?"ganho":dados.etapa; save(); closeModal(); return modalFecharVenda(id); }
  } else { const novo={id:uid(),criadoEm:new Date().toISOString().slice(0,10),...dados}; DB.negocios.push(novo);
    if(etapa==="ganho"){ save(); closeModal(); return modalFecharVenda(novo.id); } }
  save(); closeModal(); render(); toast("Negócio salvo.");
}
function excluirNegocio(id){ DB.negocios=DB.negocios.filter(n=>n.id!==id);
  DB.os=DB.os.filter(o=>o.negocioId!==id); DB.parcelas=DB.parcelas.filter(p=>p.negocioId!==id);
  save(); closeModal(); render(); toast("Negócio excluído."); }
function perderNegocio(id){ const n=DB.negocios.find(x=>x.id===id); n.etapa="perdido"; n.fechadoEm=new Date().toISOString().slice(0,10); save(); closeModal(); render(); toast("Negócio marcado como perdido."); }

/* ============================================================
   Fechamento de venda · Oficina (OS) · Financeiro (crediário)
   ============================================================ */
function osDoNegocio(nid){ return DB.os.find(o=>o.negocioId===nid); }
function parcelasDoNegocio(nid){ return DB.parcelas.filter(p=>p.negocioId===nid).sort((a,b)=>a.n-b.n); }
function parcelasAbertas(){ return DB.parcelas.filter(p=>!p.pagoEm); }
function parcelasAtrasadas(){ return parcelasAbertas().filter(p=>d(p.venceEm)<today()); }
function aReceber(){ return parcelasAbertas().reduce((s,p)=>s+p.valor,0); }
function recebidoNoMes(){ return DB.parcelas.filter(p=>p.pagoEm&&mesKey(p.pagoEm)===curMonth()).reduce((s,p)=>s+p.valor,0); }

/* --- Modal de fechamento: pagamento + ordem de serviço --- */
function modalFecharVenda(nid){
  const n=DB.negocios.find(x=>x.id===nid); if(!n) return;
  const c=cliente(n.clienteId);
  const temLente=n.itens.some(i=>{const p=produto(i.produtoId);return p&&p.categoria==="Lente";});
  const hoje=new Date().toISOString().slice(0,10);
  const prev=new Date(); prev.setDate(prev.getDate()+(DB.config.prazoLabDias||7));
  openModal(`<div class="modal wide"><div class="modal-h"><h3>Fechar venda — ${c?c.nome:''}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div style="background:var(--accent-wash);border-radius:10px;padding:11px 13px;margin-bottom:16px;display:flex;align-items:center">
        <div><div style="font-size:12px;color:var(--accent-ink);font-weight:700">${n.titulo}</div>
        <div class="muted" style="font-size:12px">${n.itens.map(i=>{const p=produto(i.produtoId);return p?p.nome:''}).join(' · ')||'sem itens'}</div></div>
        <div class="num" style="margin-left:auto;font-size:20px;font-weight:700">${brl(n.valor)}</div></div>

      <h4 style="margin:0 0 10px;font-size:13px">Pagamento</h4>
      <div class="frow-3">
        <div class="field"><label>Forma</label><select id="fvForma" onchange="fvToggle()">${FORMAS.map(f=>`<option>${f}</option>`).join("")}</select></div>
        <div class="field"><label>Parcelas</label><input id="fvQtd" type="number" min="1" max="24" value="1" oninput="fvPreview()"></div>
        <div class="field"><label>1º vencimento</label><input id="fvVenc" type="date" value="${hoje}" onchange="fvPreview()"></div>
      </div>
      <div id="fvPrev" class="muted" style="font-size:12.5px;margin:-4px 0 16px"></div>

      <h4 style="margin:0 0 10px;font-size:13px">Ordem de serviço</h4>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px">
        <input type="checkbox" id="fvTemOS" ${temLente?'checked':''} onchange="fvToggle()"> Enviar para laboratório
      </label>
      <div id="fvOSbox" class="frow">
        <div class="field"><label>Laboratório</label><select id="fvLab">${(DB.config.laboratorios||[]).map(l=>`<option>${l}</option>`).join("")}</select></div>
        <div class="field"><label>Previsão de chegada</label><input id="fvPrevData" type="date" value="${prev.toISOString().slice(0,10)}"></div>
      </div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="confirmarVenda('${nid}')">Confirmar venda</button></div></div>`);
  window._fvValor = n.valor;
  fvToggle();
}
function fvToggle(){
  const forma=$("#fvForma").value;
  const qtd=$("#fvQtd");
  if(forma==="À vista"){ qtd.value=1; qtd.disabled=true; } else { qtd.disabled=false; if(+qtd.value<2) qtd.value=3; }
  $("#fvOSbox").style.display = $("#fvTemOS").checked? "grid":"none";
  fvPreview();
}
function fvPreview(){
  const n=+$("#fvQtd").value||1; const box=$("#fvPrev"); if(!box) return;
  const val=window._fvValor||0;
  const p=Math.round(val/n*100)/100;
  box.textContent = n===1? `Parcela única de ${brl(val)}, quitada na confirmação.`
    : `${n} parcelas de ${brl(p)}, mensais a partir do 1º vencimento.`;
}
function confirmarVenda(nid){
  const n=DB.negocios.find(x=>x.id===nid); if(!n) return;
  const forma=$("#fvForma").value, qtd=Math.max(1,+$("#fvQtd").value||1), venc=$("#fvVenc").value;
  const hoje=new Date().toISOString().slice(0,10);
  n.etapa="ganho"; n.atualizadoEm=hoje;
  ganharNegocio(n);                                   // estoque + tarefa de pós-venda
  // parcelas
  const val=Math.round(n.valor/qtd*100)/100;
  for(let k=0;k<qtd;k++){
    const vc=d(venc)||new Date(); const dt=new Date(vc); dt.setMonth(dt.getMonth()+k);
    DB.parcelas.push({id:uid(),negocioId:n.id,clienteId:n.clienteId,n:k+1,total:qtd,valor:val,
      venceEm:dt.toISOString().slice(0,10), pagoEm: (forma==="À vista"||(forma==="Cartão"&&k===0&&qtd===1))?hoje:null, forma});
  }
  // ordem de serviço
  if($("#fvTemOS").checked){
    const num=(DB.os.reduce((m,o)=>Math.max(m,o.numero||1000),1000))+1;
    DB.os.push({id:uid(),negocioId:n.id,clienteId:n.clienteId,numero:num,status:"aguardando",
      laboratorio:$("#fvLab").value,enviadoEm:null,previsaoEm:$("#fvPrevData").value,chegouEm:null,entregueEm:null,obs:""});
  }
  save(); closeModal(); render();
  toast("Venda fechada! 🎉 " + ($("#fvTemOS")?.checked?"OS criada · ":"") + "pós-venda agendado.");
}

/* --- Oficina: acompanhamento das ordens de serviço --- */
function renderOficina(app){
  const abertas=DB.os.filter(o=>o.status!=="entregue");
  const atrasadas=abertas.filter(o=>o.previsaoEm && d(o.previsaoEm)<today() && o.status!=="pronto");
  setHeader("Oficina", `${abertas.length} ordens em andamento${atrasadas.length?` · <b style="color:var(--alert)">${atrasadas.length} atrasadas no laboratório</b>`:''}`,'');
  app.innerHTML=`<div class="board">${OS_STATUS.map(st=>{
    const list=DB.os.filter(o=>o.status===st.id)
      .sort((a,b)=>(a.previsaoEm||'')<(b.previsaoEm||'')?-1:1)
      .slice(0, st.id==="entregue"?12:99);
    return `<div class="col${_colRecebeu===st.id?' received':''}">
      <div class="col-h"><span class="stg" style="background:${st.cor}"></span><b>${st.nome}</b>
        <span class="c num">${DB.os.filter(o=>o.status===st.id).length}</span>
        <span class="sum">${st.id==="entregue"?"últimas 12":"&nbsp;"}</span></div>
      <div class="col-body">${list.map(o=>osCard(o)).join("")||'<div class="muted" style="font-size:12px;padding:10px;text-align:center">—</div>'}</div>
    </div>`;}).join("")}</div>`;
  _movido=null; _colRecebeu=null;
}
function osCard(o){
  const c=cliente(o.clienteId); const n=DB.negocios.find(x=>x.id===o.negocioId);
  const dias=o.previsaoEm? daysUntil(d(o.previsaoEm)):null;
  const atrasada = dias!==null && dias<0 && !["pronto","entregue"].includes(o.status);
  const idx=OS_STATUS.findIndex(s=>s.id===o.status);
  const prox=OS_STATUS[idx+1];
  return `<div class="deal${_movido===o.id?' landed':''}" style="cursor:default">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="chip neutral" style="font-size:10.5px">OS ${o.numero}</span>
      ${atrasada?`<span class="chip alert" style="font-size:10.5px">${Math.abs(dias)}d atrasada</span>`
        :dias!==null&&o.status!=="entregue"?`<span class="chip ${dias<=1?'warn':'neutral'}" style="font-size:10.5px">${dias>=0?'chega em '+dias+'d':'—'}</span>`:''}
    </div>
    <div class="t" style="margin-top:5px">${c?c.nome:'—'}</div>
    <div class="cl">${n?n.titulo:''} · ${o.laboratorio||'—'}</div>
    <div class="meta">
      ${prox?`<button class="btn sm" onclick="avancarOS('${o.id}')">→ ${prox.nome}</button>`:''}
      ${o.status==="pronto"&&c?`<a class="btn wa sm" target="_blank" href="${waLink(c.telefone,`Boa notícia, ${c.nome.split(' ')[0]}! Seu óculos já chegou e está pronto para retirada na ${DB.config.nome}. Te esperamos!`)}">Avisar</a>`:''}
    </div></div>`;
}
function avancarOS(id){
  const o=DB.os.find(x=>x.id===id); if(!o) return;
  const idx=OS_STATUS.findIndex(s=>s.id===o.status); const prox=OS_STATUS[idx+1]; if(!prox) return;
  const hoje=new Date().toISOString().slice(0,10);
  o.status=prox.id;
  if(prox.id==="lab") o.enviadoEm=hoje;
  if(prox.id==="chegou") o.chegouEm=hoje;
  if(prox.id==="pronto"){                     // avisar o cliente vira tarefa, não boa intenção
    DB.tarefas.push({id:uid(),clienteId:o.clienteId,negocioId:o.negocioId,
      titulo:"Avisar que o óculos chegou (OS "+o.numero+")",tipo:"whatsapp",venceEm:hoje,feito:false});
  }
  if(prox.id==="entregue") o.entregueEm=hoje;
  _movido=o.id; _colRecebeu=prox.id;
  save(); render(); toast("OS "+o.numero+" → "+prox.nome+".");
}

/* --- Financeiro: crediário e cobrança --- */
function renderFinanceiro(app){
  const atras=parcelasAtrasadas(), abertas=parcelasAbertas();
  setHeader("Financeiro", `${abertas.length} parcelas em aberto · ${atras.length} vencidas`,'');
  const hoje=today();
  const prox30=abertas.filter(p=>{const x=d(p.venceEm);return x>=hoje && daysUntil(x)<=30;});
  const linha=(p)=>{ const c=cliente(p.clienteId); const venc=d(p.venceEm)<hoje;
    const dias=Math.abs(daysUntil(d(p.venceEm)));
    return `<tr>
      <td class="row-click" onclick="abrirCliente('${p.clienteId}')"><div class="who"><div class="avatar">${c?initials(c.nome):'?'}</div>
        <div><div class="strong">${c?c.nome:'—'}</div><div class="muted" style="font-size:12px">${p.forma} · parcela ${p.n}/${p.total}</div></div></div></td>
      <td class="num strong">${brl(p.valor)}</td>
      <td><span class="chip ${venc?'alert':'neutral'}">${fmtDate(p.venceEm)}${venc?` · ${dias}d`:''}</span></td>
      <td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end">
        ${c?`<a class="btn wa sm" target="_blank" href="${waLink(c.telefone, venc
            ? `Olá, ${c.nome.split(' ')[0]}! Passando para lembrar da parcela ${p.n}/${p.total} de ${brl(p.valor)}, vencida em ${fmtDate(p.venceEm)}. Qualquer coisa a gente combina o melhor jeito. — ${DB.config.nome}`
            : `Olá, ${c.nome.split(' ')[0]}! Lembrete da parcela ${p.n}/${p.total} de ${brl(p.valor)}, que vence em ${fmtDate(p.venceEm)}. — ${DB.config.nome}`)}">Cobrar</a>`:''}
        <button class="btn sm" onclick="receberParcela('${p.id}')">Receber</button></div></td></tr>`; };
  app.innerHTML=`
  <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    ${kpi("A receber", brlShort(aReceber()), `<span class="muted" style="font-size:12px">${abertas.length} parcelas</span>`)}
    ${kpi("Vencido", brlShort(atras.reduce((s,p)=>s+p.valor,0)), `<span class="delta ${atras.length?'down':'flat'}">${atras.length} em atraso</span>`)}
    ${kpi("Recebido no mês", brlShort(recebidoNoMes()), `<span class="muted" style="font-size:12px">${DB.parcelas.filter(p=>p.pagoEm&&mesKey(p.pagoEm)===curMonth()).length} baixas</span>`)}
    ${kpi("Vence em 30d", brlShort(prox30.reduce((s,p)=>s+p.valor,0)), `<span class="muted" style="font-size:12px">${prox30.length} parcelas</span>`)}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Em atraso</h3><span class="count">${atras.length}</span></div>
    ${atras.length?`<table><thead><tr><th>Cliente</th><th>Valor</th><th>Venceu</th><th></th></tr></thead>
      <tbody>${atras.sort((a,b)=>a.venceEm<b.venceEm?-1:1).map(linha).join("")}</tbody></table>`
      :emptyBox('Nenhuma parcela em atraso. 👏')}</div>
  <div class="card"><div class="card-h"><h3>A vencer</h3><span class="count">${abertas.length-atras.length}</span></div>
    ${abertas.length-atras.length?`<table><thead><tr><th>Cliente</th><th>Valor</th><th>Vence</th><th></th></tr></thead>
      <tbody>${abertas.filter(p=>d(p.venceEm)>=hoje).sort((a,b)=>a.venceEm<b.venceEm?-1:1).map(linha).join("")}</tbody></table>`
      :emptyBox('Nada a vencer.')}</div>`;
}
function receberParcela(id){ const p=DB.parcelas.find(x=>x.id===id); if(!p)return;
  p.pagoEm=new Date().toISOString().slice(0,10); save();
  sairLinha(event, ()=>{ render(); toast("Parcela recebida — "+brl(p.valor)+"."); }); }

/* A linha desaparece antes da lista se reorganizar: o usuário vê o que causou a mudança. */
function sairLinha(ev, depois){
  const tr = ev && ev.target && ev.target.closest ? ev.target.closest("tr") : null;
  if(!tr || reduzMovimento){ depois(); return; }
  tr.classList.add("leaving");
  setTimeout(depois, 130);
}

/* ---------- helpers UI ---------- */
function emptyBox(msg){ return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg><div>${msg}</div></div>`; }

/* ---------- boot ---------- */
initTema();
render();
</script>
