  :root{
    color-scheme:light;
    /* Paleta: Orangeville #e67361 · Mountain Sage #a5ab8b · Lead #1f1f1f · Gainsboro #d9d9d9.
       Papéis: Lead é o texto e o cartão em destaque; Orangeville é a ação e a marca;
       Sage marca rótulo informativo e as etapas do funil; Gainsboro é linha e recesso.
       Branco sobre Orangeville dá 3,0:1, abaixo do mínimo para texto de 13 px, então o
       texto sobre a cor da marca é Lead (5,5:1). Texto na cor da marca usa um tom mais
       fundo, --accent-ink (5,3:1 no branco). */
    --ink:#1f1f1f;
    --ink-2:#474747;
    --ink-3:#6b6b6b;
    --paper:#f4f4f2;         /* plano de fundo — o nível mais "ao fundo" */
    --sunken:#ebebe8;        /* recesso: colunas de kanban, trilhos */
    --surface:#ffffff;       /* nível 1: cartões, tabelas */
    --surface-2:#f9f9f8;     /* hover / listras */
    --raised:#ffffff;        /* nível 2: cartões arrastáveis */
    --line:#d9d9d9;
    --line-soft:#e9e9e7;
    --accent:#e67361;
    --accent-2:#d9604e;      /* tom de baixo do gradiente da marca e do hover */
    --on-accent:#1f1f1f;
    --accent-ink:#b0473a;
    --accent-wash:#fbebe7;
    --sage:#a5ab8b; --sage-ink:#5c6147; --sage-wash:#eef0e7;
    /* Status: o vermelho de alerta é carmim, não terracota, para não se
       confundir com a cor da marca. O verde puxa para o sálvia. */
    --ok:#44693b;  --ok-wash:#e9f0e5;
    --warn:#8f5a05;--warn-wash:#fbf0dc;
    --alert:#b42318;--alert-wash:#fdeceb;
    /* Escala de elevação: a distância do plano de fundo carrega significado */
    --e0:inset 0 1px 2px rgba(31,31,31,.06);
    --e1:0 1px 2px rgba(31,31,31,.05), 0 2px 6px rgba(31,31,31,.045);
    --e2:0 2px 4px rgba(31,31,31,.06), 0 8px 20px rgba(31,31,31,.08);
    --e3:0 12px 24px rgba(31,31,31,.12), 0 32px 64px rgba(31,31,31,.18);
    --shadow:var(--e1);
    --radius:12px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    /* Motion: curvas únicas, duração curta — movimento que explica, não que enfeita */
    --ease:cubic-bezier(.2,.7,.3,1);
    --fast:120ms; --mid:220ms;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    /* Lateral no mesmo creme do fundo: a tela lê como uma peça só. */
    --side-bg:#ececea; --side-ink:#474747; --side-hi:#1f1f1f; --side-hover:rgba(31,31,31,.06);
    --side-line:#d9d9d9; --side-badge:rgba(31,31,31,.09);
    --toast-solid:#1f1f1f; --toast-ink:#f4f4f2;
    --topbar:rgba(244,244,242,.85);
    --chip-neutral:rgba(31,31,31,.06);
    /* Etapas do funil: do Gainsboro ao Sage, e Orangeville na última etapa
       aberta, a mais perto da venda. Vermelho, âmbar e verde são de status. */
    --et-1:#d9d9d9; --et-2:#c2c6ae; --et-3:#a5ab8b; --et-4:#878d6c; --et-5:#e67361;
    --prio-alta:var(--alert); --prio-baixa:#d9d9d9;
    /* Cartão em destaque: Lead, com o mês corrente em Orangeville. */
    --focal-bg:#1f1f1f; --focal-ink:#ffffff; --focal-ink-2:rgba(255,255,255,.7); --focal-line:rgba(255,255,255,.14);
    --focal-atual:#e67361;
  }
  /* Tema escuro construído do zero, não invertido: neutros quentes, acento clareado
     para manter contraste AA sobre superfície escura. */
  [data-theme="dark"]{
    color-scheme:dark;
    --ink:#ececec;
    --ink-2:#bdbdbd;
    --ink-3:#969696;
    --paper:#141414;
    --sunken:#101010;
    --surface:#1f1f1f;
    --surface-2:#262626;
    --raised:#2a2a2a;
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.06);
    --accent:#e67361;
    --accent-2:#d9604e;
    --on-accent:#1f1f1f;
    --accent-ink:#f0907f;
    --accent-wash:rgba(230,115,97,.16);
    --sage:#a5ab8b; --sage-ink:#c3c8ab; --sage-wash:rgba(165,171,139,.16);
    --ok:#8fbf7f;  --ok-wash:rgba(143,191,127,.15);
    --warn:#d99b2b; --warn-wash:rgba(217,155,43,.16);
    --alert:#f2675c; --alert-wash:rgba(242,103,92,.16);
    --e0:inset 0 1px 2px rgba(0,0,0,.4);
    --e1:0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.25);
    --e2:0 2px 4px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
    --e3:0 12px 24px rgba(0,0,0,.5), 0 32px 64px rgba(0,0,0,.6);
    --side-bg:#101010; --side-ink:#a3a3a3; --side-hi:#ececec; --side-hover:rgba(255,255,255,.06);
    --side-line:rgba(255,255,255,.06); --side-badge:rgba(255,255,255,.14);
    --toast-solid:#0b0b0b; --toast-ink:#ececec;
    --topbar:rgba(20,20,20,.85);
    --chip-neutral:rgba(255,255,255,.09);
    --et-1:#4a4a4a; --et-2:#6f735f; --et-3:#a5ab8b; --et-4:#c3c8ab; --et-5:#e67361;
    --prio-alta:var(--alert); --prio-baixa:#4a4a4a;
    /* No escuro, um cartão Lead some no fundo: o destaque vira Orangeville com texto Lead. */
    --focal-bg:#e67361; --focal-ink:#1f1f1f; --focal-ink-2:rgba(31,31,31,.72); --focal-line:rgba(31,31,31,.14);
    --focal-atual:#1f1f1f;
  }

  /* ---------- Liquid Glass ----------
     Material reservado às superfícies de chrome — barra superior, modal e toast.
     Nunca sobre conteúdo: texto de dados precisa de fundo opaco para ser lido.

     A base é SÓLIDA. O vidro é um acréscimo que só entra quando três condições
     se confirmam, e cada uma delas pode devolver tudo ao sólido sozinha:
       1. o navegador suporta backdrop-filter  (@supports, abaixo)
       2. o sistema não pede transparência reduzida  (@media, abaixo)
       3. o usuário não desligou em Config → Aparência  ([data-glass="off"])
     Por isso o fallback nunca precisa ser escrito duas vezes: ele é o padrão. */
  :root{
    --glass-blur:none;
    --glass-bar:var(--paper);
    --glass-panel:var(--surface);
    --glass-scrim:rgba(31,31,31,.42);
    --glass-scrim-blur:none;
    --glass-toast:var(--toast-solid);
    --glass-edge:transparent;
  }
  /* CUIDADO ao mexer daqui para baixo: todos os blocos usam :root como base e a
     ordem de origem é que decide, porque a especificidade é igual de propósito.
     Trocar :root por html aqui quebra tudo em silêncio — html é seletor de tipo
     (0,0,1) e perde para o :root (0,1,0) do bloco sólido lá em cima. */
  @supports ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
    :root{
      --glass-blur:saturate(165%) blur(16px);
      --glass-bar:rgba(244,244,242,.68);
      --glass-panel:rgba(255,255,255,.82);
      --glass-scrim:rgba(31,31,31,.34);
      --glass-scrim-blur:blur(3px);
      --glass-toast:rgba(31,31,31,.80);
      --glass-edge:rgba(255,255,255,.55);
    }
    :root[data-theme="dark"]{
      --glass-bar:rgba(20,20,20,.66);
      --glass-panel:rgba(31,31,31,.84);
      --glass-scrim:rgba(0,0,0,.52);
      --glass-toast:rgba(11,14,17,.80);
      --glass-edge:rgba(255,255,255,.10);
    }
  }
  /* Camada 2: o sistema pede menos transparência — o material sai inteiro.
     O seletor escuro precisa existir aqui também: sem ele, :root[data-theme="dark"]
     do bloco acima (0,2,0) venceria um :root solitário (0,1,0) no tema escuro. */
  @media (prefers-reduced-transparency:reduce){
    :root,:root[data-theme="dark"]{
      --glass-blur:none; --glass-scrim-blur:none; --glass-edge:transparent;
      --glass-bar:var(--paper); --glass-panel:var(--surface);
      --glass-scrim:rgba(31,31,31,.42); --glass-toast:var(--toast-solid);
    }
  }
  /* Camada 3: o usuário desligou. Vence as duas anteriores por especificidade
     (0,2,0 e 0,3,0) e, nos empates, por vir depois. */
  :root[data-glass="off"],:root[data-theme="dark"][data-glass="off"]{
    --glass-blur:none; --glass-scrim-blur:none; --glass-edge:transparent;
    --glass-bar:var(--paper); --glass-panel:var(--surface);
    --glass-scrim:rgba(31,31,31,.42); --glass-toast:var(--toast-solid);
  }
  /* O brilho de borda é o que faz o vidro parecer vidro e não só um borrão:
     uma linha clara no topo, como a quina de uma lâmina. Some junto com o resto.
     Aplicado via :after em elementos que JÁ são posicionados (sticky/fixed) —
     uma classe com position:relative quebraria o sticky da barra. */
  .topbar:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:var(--glass-edge);pointer-events:none}

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--accent-ink)}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--paper)}

  /* ---------- Shell ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
  .side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:6px;
    border-right:1px solid var(--side-line)}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;color:var(--side-hi)}
  .brand .mark{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(150deg,var(--accent),var(--accent-2));display:grid;place-items:center}
  .brand .mark svg{width:18px;height:18px}
  .brand b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;letter-spacing:0}
  .brand small{display:block;color:var(--side-ink);opacity:.8;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--side-ink);padding:9px 10px;border-radius:9px;
    font-size:13.5px;font-weight:500;transition:background .12s,color .12s
  }
  .nav button:hover{background:var(--side-hover);color:var(--side-hi)}
  .nav button.active{background:var(--accent);color:var(--on-accent)}
  .nav button .ic{width:17px;height:17px;flex:none;opacity:.92}
  .nav .badge{margin-left:auto;background:var(--side-badge);color:var(--side-hi);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
  .nav button.active .badge{color:var(--on-accent);background:rgba(31,31,31,.14)}
  .nav button.active .badge{background:rgba(255,255,255,.24)}
  .side-foot{margin-top:auto;font-size:11px;color:var(--ink-3);line-height:1.5;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.06)}

  .main{overflow:auto;display:flex;flex-direction:column;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;background:var(--glass-bar);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;margin:0;letter-spacing:0}
  .topbar h1 em{font-style:italic}
  .topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .content{padding:22px 26px 60px;max-width:1280px;width:100%}
  @media (min-width:701px){ .topbar{min-height:76px} }   /* mesma altura com ou sem subtítulo */

  /* ---------- Buttons / chips ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.12s}
  .btn:hover{border-color:rgba(31,31,31,.28);box-shadow:var(--shadow)}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--surface-2);box-shadow:none}
  .btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
  a.btn{text-decoration:none}
  .btn.wa{background:var(--ok-wash);border-color:transparent;color:var(--ok)}
  .btn.wa:hover{filter:brightness(.96)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.01em}
  .chip.ok{background:var(--ok-wash);color:var(--ok)}
  .chip.warn{background:var(--warn-wash);color:var(--warn)}
  .chip.alert{background:var(--alert-wash);color:var(--alert)}
  .chip.neutral{background:var(--chip-neutral);color:var(--ink-2)}
  .chip.accent{background:var(--sage-wash);color:var(--sage-ink)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* ---------- Cards / grid ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--e1)}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .card-h h3{margin:0;font-size:14px;letter-spacing:.01em}
  .card-h .count{color:var(--ink-3);font-size:12.5px;font-weight:600}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--e1)}
  .kpi .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--ink-3)}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:4px}
  .kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--alert)} .kpi .delta.flat{color:var(--ink-3)}

  /* ---------- Tables ---------- */
  /* ---------- Motion como linguagem de estado ----------
     Regra: só anima o que comunica causa e efeito. Nada decorativo. */
  @keyframes settle{ from{transform:translateY(-6px) scale(.985);opacity:.5} to{transform:none;opacity:1} }
  @keyframes pulseCol{ 0%{box-shadow:inset 0 0 0 2px var(--accent)} 100%{box-shadow:var(--e0)} }
  @keyframes leaveRow{ to{opacity:0;transform:translateX(10px)} }
  @keyframes riseIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .deal.landed{animation:settle var(--mid) var(--ease)}          /* cartão que acabou de mudar de etapa */
  .col.received{animation:pulseCol 600ms var(--ease)}            /* coluna que recebeu o cartão */
  .leaving{animation:leaveRow var(--fast) var(--ease) forwards}  /* linha baixada/concluída */
  .content>*{animation:riseIn var(--mid) var(--ease)}
  /* Alvo de drop "atrai" o cartão: a coluna cresce levemente sob o cursor */
  .col{transition:transform var(--fast) var(--ease),background var(--fast) var(--ease)}
  .col.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-wash);transform:scale(1.015)}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:var(--mid)}

  .theme-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
  .theme-btn:hover{box-shadow:var(--e1)}

  /* ---------- Bento: módulos assimétricos, densidade sem sobrecarga ---------- */
  .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;align-items:stretch}
  .bento>*{min-width:0}
  .b7{grid-column:span 7} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b4{grid-column:span 4} .b3{grid-column:span 3}
  .b-kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1100px){ .bento>*{grid-column:span 12} }

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    font-weight:700;padding:9px 16px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface)}
  td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--surface-2)}
  .row-click{cursor:pointer}
  .muted{color:var(--ink-3)}
  .strong{font-weight:600}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .who{display:flex;align-items:center;gap:10px}

  /* ---------- Kanban ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:stretch}
  .col{flex:none;width:270px;min-height:calc(100vh - 190px);background:var(--sunken);box-shadow:var(--e0);border:1px solid var(--line-soft);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
  .col-h{padding:11px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;border-bottom:1px solid var(--line-soft)}
  .col-h .stg{width:9px;height:9px;border-radius:3px;flex:none}
  .col-h b{font-size:12.5px;letter-spacing:.01em}
  .col-h .c{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:700}
  .col-h .sum{width:100%;flex-basis:100%;font-size:11px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
  .col-body{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:40px}
  .deal{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:var(--e1);cursor:grab;
    transition:box-shadow var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .deal:hover{box-shadow:var(--e2);transform:translateY(-1px)}
  .deal:active{cursor:grabbing}
  .deal.drag{opacity:.4}
  .deal .t{font-weight:600;font-size:13px;line-height:1.3}
  .deal .cl{color:var(--ink-3);font-size:12px;margin-top:2px}
  .deal .meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .deal .v{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
  .flag{width:6px;border-radius:6px;align-self:stretch}

  /* ---------- Detail (cliente 360) ---------- */
  .detail{display:grid;grid-template-columns:320px 1fr;gap:16px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-3)}
  .kv .v{font-weight:600;text-align:right}
  .rx{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px}
  .rx table{font-size:12.5px}
  .rx th,.rx td{padding:5px 8px;border:0;text-align:center;background:transparent;position:static}
  .rx th{text-transform:none;letter-spacing:0;font-size:11px}
  .rx .lens-row td:first-child{text-align:left;font-weight:700;color:var(--ink-2)}
  .timeline{position:relative;padding-left:18px}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;padding:0 0 14px 6px}
  .ev:before{content:"";position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .ev .d{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .ev .b{font-size:13px;margin-top:1px}

  /* ---------- Fila de trabalho ----------
     Regra de leitura: o FATO é o que está no banco e pode ser conferido.
     A SUGESTÃO é opinião do sistema. Nunca têm o mesmo peso tipográfico,
     porque confundir os dois é como ler um palpite achando que é laudo. */
  .fila-item{display:grid;grid-template-columns:3px 1fr auto;gap:13px;padding:12px 16px;
    border-bottom:1px solid var(--line-soft);align-items:center}
  .fila-item:last-child{border-bottom:0}
  .fila-peso{align-self:stretch;border-radius:3px;min-height:34px}
  .fila-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fila-fato{font-size:13.5px;font-weight:600;line-height:1.35}
  .fila-sug{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:7px;align-items:baseline}
  .fila-sug b{flex:none;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    font-weight:800;opacity:.75;padding-top:1px}
  .fila-sug i{font-style:normal}
  .fila-acoes{display:flex;gap:7px;align-items:center;flex:none}
  .fila-legenda{font-size:12px;color:var(--ink-3);padding:9px 16px;background:var(--surface-2);
    border-bottom:1px solid var(--line-soft);line-height:1.5}
  @media (max-width:700px){
    .fila-item{grid-template-columns:3px 1fr;row-gap:9px}
    .fila-acoes{grid-column:2;justify-content:flex-start}
  }

  /* ---------- Datas, KPIs e gráfico do Painel ---------- */
  .data{font-size:12.5px;color:var(--ink-2)}
  /* Cartão estreito: nome e detalhe em uma linha, com reticências. A célula
     com max-width:0 é o que deixa a tabela encolher o texto em vez de quebrar. */
  td.uma-linha{max-width:0;width:100%}
  td.uma-linha .strong,td.uma-linha .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.uma-linha .who>div:last-child{min-width:0}
  .so-cel{display:none}
  .kpis3{grid-template-columns:repeat(3,1fr)} .kpis4{grid-template-columns:repeat(4,1fr)}
  .detail>*{min-width:0}
  .barras{color:var(--ink-2)}
  .barras-plot{position:relative;height:190px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
    border-bottom:1px solid var(--line)}
  .barra{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
  .barra b{font-size:12px;font-weight:700;text-align:center;margin:0 auto 3px;white-space:nowrap;position:relative;z-index:1;
    background:var(--surface);padding:0 4px;border-radius:4px}
  .barra i{display:block;background:currentColor;opacity:.3;border-radius:5px 5px 0 0}
  .barra.atual i{background:var(--accent);opacity:1}
  .barras-meta{position:absolute;left:0;right:0;border-top:1px dashed var(--alert);opacity:.75;pointer-events:none}
  .barras-meta span{position:absolute;right:0;bottom:2px;font-size:11px;font-weight:700;color:var(--alert);
    background:var(--surface);padding:0 0 0 4px;z-index:2}
  .barras-mes{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:6px}
  .barras-mes span{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center}

  /* ---------- Faturamento: cartão em cor cheia ---------- */
  .card.focal{background:var(--focal-bg);color:var(--focal-ink);border-color:transparent;display:flex;flex-direction:column}
  .card.focal .card-h{border-bottom-color:var(--focal-line)}
  .card.focal .card-h h3{color:var(--focal-ink)}
  .card.focal .count{color:var(--focal-ink-2)}
  .card.focal .chartwrap{flex:1;display:flex;flex-direction:column}
  .card.focal .barras{flex:1;display:flex;flex-direction:column;color:var(--focal-ink)}
  .card.focal .barras-plot{flex:1;min-height:190px;height:auto;border-bottom-color:var(--focal-line)}
  .card.focal .barra i{background:var(--focal-ink);opacity:.24}
  .card.focal .barra.atual i{background:var(--focal-atual);opacity:1}
  .card.focal .barra b{background:var(--focal-bg);color:var(--focal-ink)}
  .card.focal .barras-meta{border-top-color:var(--focal-ink);opacity:.6}
  .card.focal .barras-meta span{background:var(--focal-bg);color:var(--focal-ink)}
  .card.focal .barras-mes span{color:var(--focal-ink-2)}
  .fat-topo{padding:16px 18px 4px;display:flex;align-items:flex-end;gap:16px}
  .fat-lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--focal-ink-2)}
  .fat-num{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;letter-spacing:0;margin-top:4px}
  .fat-delta{font-size:12.5px;font-weight:700;margin-top:6px}
  .fat-lado{margin-left:auto;text-align:right;font-size:12px;color:var(--focal-ink-2)}
  @media (max-width:700px){ .fat-num{font-size:40px} .fat-topo{flex-wrap:wrap} .fat-lado{margin-left:0;text-align:left} }

  /* ---------- Kanban: colunas fora da tela ---------- */
  .board-wrap{position:relative}
  .board-wrap:after{content:"";position:absolute;top:0;bottom:8px;right:0;width:56px;pointer-events:none;
    background:linear-gradient(to left,var(--paper),transparent);opacity:0;transition:opacity var(--fast) var(--ease)}
  .board-wrap.mais-dir:after{opacity:1}
  .board-mais{position:absolute;right:8px;bottom:30px;z-index:2;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;box-shadow:var(--e2);cursor:pointer;display:none}
  .board-wrap.mais-dir .board-mais{display:block}

  /* ---------- Celular ---------- */
  @media (max-width:700px){
    .content{padding:16px 14px 60px}
    .topbar{flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
    .topbar .titulo{flex:1 1 0;min-width:0}
    .topbar .spacer{display:none}
    .topbar h1{font-size:25px}
    #pageActions{order:10;flex:1 1 100%}
    #pageActions:empty{display:none}
    #pageActions .btn{padding:6px 10px;font-size:12.5px}
    .kpis3,.kpis4{grid-template-columns:1fr 1fr}
    table.resp thead{display:none}
    table.resp tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
    table.resp tr:last-child{border-bottom:0}
    table.resp td{display:block;padding:0;border:0}
    table.resp td:first-child{flex:1 1 100%;min-width:0}
    table.resp td:last-child{margin-left:auto}
    table.resp .so-desk{display:none}
    table.resp .so-cel{display:inline}
    table.resp-check td:first-child{flex:0 0 auto}
    table.resp-check td:nth-child(2){flex:1 1 calc(100% - 40px);min-width:0}
  }

  /* ---------- Follow-up ---------- */
  .fu-item{display:grid;grid-template-columns:minmax(170px,230px) 1fr auto;gap:14px;padding:12px 16px;
    border-bottom:1px solid var(--line-soft);align-items:center}
  .fu-item:last-child{border-bottom:0}
  .fu-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px}
  /* O corte em 2 linhas fica no texto, não na caixa: com o padding na mesma
     caixa, a terceira linha aparecia pela metade embaixo. */
  .fu-msg{font-size:12.5px;color:var(--ink-2);line-height:1.45;background:var(--surface-2);border:1px solid var(--line-soft);
    border-radius:9px;padding:7px 10px}
  .fu-msg>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fu-acoes{display:flex;gap:6px;align-items:center;flex:none}
  .fu-prev{font-size:13px;line-height:1.5;white-space:pre-wrap;background:var(--ok-wash);color:var(--ink);
    border-radius:10px 10px 10px 2px;padding:10px 12px;max-width:440px}
  .regua-item{display:grid;grid-template-columns:22px 36px 1fr auto;gap:12px;align-items:center;padding:12px 16px;
    border-bottom:1px solid var(--line-soft);transition:opacity var(--fast) var(--ease)}
  .regua-item:last-child{border-bottom:0}
  .regua-item.off{opacity:.5}
  .regua-tg input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .regua-ic{width:36px;height:36px;border-radius:10px;background:var(--sage-wash);color:var(--sage-ink);display:grid;place-items:center}
  .regua-quando{font-size:12px;font-weight:700;color:var(--accent-ink)}
  .regua-txt{font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vars{display:flex;flex-wrap:wrap;gap:6px}
  .vars button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:600 11.5px var(--mono);
    padding:3px 8px;border-radius:7px;cursor:pointer}
  .vars button:hover{border-color:var(--accent);color:var(--accent-ink)}
  @media (max-width:820px){
    .fu-item{grid-template-columns:1fr;row-gap:9px}
    .regua-item{grid-template-columns:22px 36px 1fr}
    .regua-item>div:last-child{grid-column:3}
  }

  /* ---------- Recompra ---------- */
  .radar-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
  .radar-legend span{display:inline-flex;align-items:center;gap:6px}
  .bar{height:6px;border-radius:6px;background:var(--sunken);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px}

  /* ---------- Charts ---------- */
  .chartwrap{padding:16px}
  .funnel-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .funnel-row .lb{width:150px;font-size:12.5px;color:var(--ink-2);flex:none}
  .funnel-row .track{flex:1;height:22px;background:var(--sunken);box-shadow:var(--e0);border-radius:6px;overflow:hidden}
  .funnel-row .track>i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .funnel-row .n{width:104px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}

  /* ---------- Forms / modal ---------- */
  .modal-bg{position:fixed;inset:0;background:var(--glass-scrim);
    -webkit-backdrop-filter:var(--glass-scrim-blur);backdrop-filter:var(--glass-scrim-blur);
    z-index:100;display:grid;place-items:center;padding:20px}
  .modal{background:var(--glass-panel);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border-radius:14px;box-shadow:var(--e3);width:100%;max-width:560px;max-height:90vh;overflow:auto}
  .modal.wide{max-width:720px}
  /* Cabeçalho e rodapé do modal rolam sobre o corpo: precisam do mesmo material,
     senão o texto do corpo aparece cru por baixo ao rolar. */
  .modal-h{position:sticky;top:0;background:var(--glass-panel);

<script>
/* ============================================================
   ÍRIS CRM — núcleo de dados
   ============================================================ */
/* Chave do armazenamento ANTIGO, de quando o Íris guardava tudo no
   navegador. Não é mais escrita — fica só para achar e trazer os dados
   que já estão na máquina de alguém. Ver migrarDoNavegador(). */
const KEY = "iris_crm_v1";
const STAGES = [
  {id:"novo",     nome:"Novo contato",      cor:"var(--et-1)"},
  {id:"exame",    nome:"Exame agendado",    cor:"var(--et-2)"},
  {id:"receita",  nome:"Receita em mãos",   cor:"var(--et-3)"},
  {id:"escolha",  nome:"Escolhendo produto",cor:"var(--et-4)"},
  {id:"orcamento",nome:"Orçamento enviado", cor:"var(--et-5)"},
  {id:"ganho",    nome:"Venda fechada",     cor:"var(--ok)"},
];
const CATS = ["Armação","Lente","Solar","Acessório","Serviço"];
const RX_TIPOS = ["Visão simples","Multifocal","Bifocal","Ocupacional","Só longe","Só perto"];
// Ciclo da ordem de serviço — o caminho real do óculos depois da venda fechada.
const OS_STATUS = [
  {id:"aguardando",nome:"Aguardando envio",   cor:"var(--et-1)"},
  {id:"lab",       nome:"No laboratório",     cor:"var(--et-3)"},
  {id:"chegou",    nome:"Chegou, conferir",   cor:"var(--warn)"},   // pede ação: é status, não etapa
  {id:"pronto",    nome:"Pronto p/ retirada", cor:"var(--et-5)"},
  {id:"entregue",  nome:"Entregue",           cor:"var(--ok)"},
];
const FORMAS = ["À vista","Cartão","Crediário"];

/* ============================================================
   PERSISTÊNCIA — API + D1, com cache de leitura e fila de escrita

   O dado mora no D1 e é o mesmo para todo mundo na loja. Mas loja
   sem internet não pode virar loja sem CRM, então:

     leitura  — o que chega da API é copiado para um cache local.
                Caiu a conexão, o app abre com a última cópia e diz
                que está desatualizado. Não finge estar online.
     escrita  — TODA gravação entra numa fila antes de sair. Com rede,
                a fila escoa na hora e o usuário não percebe. Sem rede,
                ela espera e escoa sozinha quando a conexão volta.

   A fila guarda mudanças por registro, nunca o banco inteiro: dois
   vendedores salvando ao mesmo tempo tocam linhas diferentes e nenhum
   apaga o trabalho do outro. Era esse o ponto de trocar o localStorage.
   ============================================================ */
const API     = "/api/iris";
const CACHE_K = "iris_cache_v2";
const FILA_K  = "iris_fila_v2";

function bancoVazio(){
  return { clientes:[], receitas:[], produtos:[], negocios:[], tarefas:[], os:[], parcelas:[], followups:[],
    config:{ nome:"Íris", metaMes:7500, cicloRecompraMeses:18, validadePadrao:12,
             ddi:"55", prazoLabDias:7, laboratorios:[] } };
}
let DB = bancoVazio();
let SESSAO = { logado:false, nome:"", papel:"vendedor" };
let semRede = false;
let escoando = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function podeAdmin(){ return SESSAO.papel === "admin"; }

async function api(corpo){
  const res = await fetch(API, { method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(corpo) });
  let dados = {};
  try{ dados = await res.json(); }catch(e){}
  if(res.status === 401 && dados.semSessao){
    SESSAO.logado = false;
    telaLogin("Sua sessão expirou. Entre de novo.");
    throw Object.assign(new Error("sem sessão"), { semSessao:true });
  }
  if(!res.ok) throw Object.assign(new Error(dados.erro || ("HTTP "+res.status)),
    { resposta:dados, status:res.status });
  return dados;
}

/* ---------- cache local ---------- */
function gravarCache(db){ try{ localStorage.setItem(CACHE_K, JSON.stringify(db)); }catch(e){} }
function lerCache(){
  try{ const raw = localStorage.getItem(CACHE_K); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
/* ---------- fila de escrita ---------- */
function lerFila(){
  try{ const raw = localStorage.getItem(FILA_K); const f = raw?JSON.parse(raw):[]; return Array.isArray(f)?f:[]; }
  catch(e){ return []; }
}
function gravarFila(f){ try{ localStorage.setItem(FILA_K, JSON.stringify(f)); }catch(e){} }

/* Substitui o antigo save(). Recebe só o que mudou:
     salvar({ clientes:[c] })
     salvar({ negocios:[n], parcelas:novas, os:[ordem] })
     salvar({ _remover:{ clientes:[id] } })
   A tela já foi atualizada em memória por quem chamou — aqui é só
   persistir. Por isso nada aqui bloqueia a interface. */
function salvar(mudancas){
  gravarCache(DB);
  const f = lerFila(); f.push(mudancas); gravarFila(f);
  escoarFila();
}

async function escoarFila(){
  if(escoando || !SESSAO.logado) return;
  if(!lerFila().length){ if(semRede){ semRede=false; marcarRede(); } return; }
  if(navigator.onLine === false){ semRede=true; marcarRede(); return; }
  escoando = true;
  try{
    while(true){
      const f = lerFila();
      if(!f.length) break;
      let r;
      try{
        r = await api({ acao:"gravar", mudancas:f[0] });
      }catch(e){
        if(e.semSessao){ escoando=false; return; }
        if(e.status === 403){
          // Rejeição definitiva (permissão). Repetir para sempre travaria
          // a fila inteira atrás de um lote que nunca vai passar.
          f.shift(); gravarFila(f);
          toast("Uma alteração foi recusada: " + (e.message||"sem permissão") + ".");
          continue;
        }
        throw e;                      // rede ou servidor: mantém na fila
      }
      if(r && r.erro){ f.shift(); gravarFila(f); toast("Alteração recusada: "+r.erro); continue; }
      f.shift(); gravarFila(f);
    }
    semRede = false;
  }catch(e){
    semRede = true;
  }finally{
    escoando = false;
    marcarRede();
  }
}
window.addEventListener("online", ()=>{ semRede=false; escoarFila(); });
window.addEventListener("offline", ()=>{ semRede=true; marcarRede(); });

/* Aviso honesto no cabeçalho: quantas alterações ainda não chegaram ao
   servidor. Esconder isso faria o vendedor achar que já salvou. */
function marcarRede(){
  const el = document.getElementById("avisoRede");
  if(!el) return;
  const pend = lerFila().length;
  if(!semRede && !pend){ el.style.display="none"; el.textContent=""; return; }
  el.style.display = "inline-flex";
  el.className = "chip " + (semRede ? "warn" : "neutral");
  el.textContent = semRede
    ? (pend ? `Sem conexão · ${pend} ${pend===1?"alteração":"alterações"} na fila` : "Sem conexão")
    : `Salvando ${pend}…`;
}

async function carregarDados(){
  try{
    const r = await api({ acao:"carregar" });
    DB = r.dados;
    SESSAO.papel = r.papel; SESSAO.nome = r.nome;
    gravarCache(DB);
    semRede = false;
    escoarFila();
    return true;
  }catch(e){
    if(e.semSessao) return false;
    const c = lerCache();
    if(c){ DB = c; semRede = true; toast("Sem conexão. Mostrando a última cópia salva neste aparelho."); return true; }
    throw e;
  }
}

/* ---------- Dados de exemplo ----------
   Não roda mais sozinho: com banco compartilhado, um app que se
   autopovoa encheria a base da loja de clientes fictícios. Agora só
   é chamado pelo botão em Config, e só quando a base está vazia. ---- */
function seed(){
  const today = new Date();
  const iso = (d)=> d.toISOString().slice(0,10);
  const back = (days)=>{ const d=new Date(today); d.setDate(d.getDate()-days); return iso(d); };
  const c = (nome,tel,nasc,tags)=>({id:uid(),nome,telefone:tel,email:"",nascimento:nasc,tags:tags||[],obs:"",criadoEm:back(400)});
  const clientes = [
    c("Marta Albuquerque","81 99912-3040","1976-08-02",["Multifocal"]),
    c("Ricardo Nóbrega","81 98844-1120","1984-03-19",["VIP"]),
    c("Letícia Farias","81 99677-8890","1998-11-27",[]),
    c("João Batista de Lima","81 99120-5567","1959-06-14",["Multifocal"]),
    c("Cleide Santos","81 98700-2201","1990-01-09",[]),
    c("Antônio Ferreira","81 99333-7788","1968-09-30",["Convênio"]),
  ];
  const [M,R,L,J,C2,A] = clientes;
  const rx = (cid,dataOff,tipo,od,oe,ad,val)=>({id:uid(),clienteId:cid,data:back(dataOff),tipo,
    od,oe,adicao:ad||"",dp:"63",medico:"Dra. Núcleo Visão",validadeMeses:val||12,obs:""});
  const receitas = [
    rx(M.id, 400,"Multifocal",{esf:"+1.25",cil:"-0.75",eixo:"90"},{esf:"+1.50",cil:"-0.50",eixo:"85"},"+2.00",12),
    rx(J.id, 380,"Multifocal",{esf:"+2.00",cil:"-1.00",eixo:"180"},{esf:"+2.25",cil:"-0.75",eixo:"175"},"+2.50",12),
    rx(R.id, 90,"Visão simples",{esf:"-2.00",cil:"0.00",eixo:"-"},{esf:"-1.75",cil:"-0.25",eixo:"10"},"",24),
    rx(C2.id, 20,"Só perto",{esf:"+1.00",cil:"0.00",eixo:"-"},{esf:"+1.00",cil:"0.00",eixo:"-"},"",12),
  ];
  const produtos = [
    {id:uid(),nome:"Armação acetato clássica",categoria:"Armação",marca:"Angel",preco:390,custo:150,estoque:12},
    {id:uid(),nome:"Armação metal premium",categoria:"Armação",marca:"Angel",preco:640,custo:260,estoque:7},
    {id:uid(),nome:"Lente multifocal digital antirreflexo",categoria:"Lente",marca:"Sanger",preco:1180,custo:430,estoque:99},
    {id:uid(),nome:"Lente visão simples antirreflexo",categoria:"Lente",marca:"Sanger",preco:420,custo:150,estoque:99},
    {id:uid(),nome:"Lente fotossensível",categoria:"Lente",marca:"Sanger",preco:890,custo:340,estoque:99},

  const pid = (n)=>produtos[n].id;
  const deal = (cid,titulo,etapa,itens,offset,rxId,fechOff)=>{
    const valor = itens.reduce((s,i)=>s+i.preco*i.qtd,0);
    const d = {id:uid(),clienteId:cid,titulo,etapa,itens,valor,receitaId:rxId||null,origem:"Balcão",
      prioridade:"media",criadoEm:back(offset),atualizadoEm:back(offset)};
    if(etapa==="ganho"){ d.fechadoEm=back(fechOff!=null?fechOff:offset); d.garantiaMeses=12; }

  };
  const negocios = [
    // Ganhos antigos (>1 ano) — base do motor de recompra por receita vencida
    deal(M.id,"Multifocal completo",   "ganho",[{produtoId:pid(1),qtd:1,preco:640},{produtoId:pid(2),qtd:1,preco:1180}],400,receitas[0].id,395),
    deal(J.id,"Óculos multifocal",     "ganho",[{produtoId:pid(0),qtd:1,preco:390},{produtoId:pid(2),qtd:1,preco:1180}],380,receitas[1].id,376),
    // Ganhos recentes — populam faturamento dos últimos 6 meses (inclui o mês atual)
    deal(A.id,"Óculos de grau",        "ganho",[{produtoId:pid(1),qtd:1,preco:640},{produtoId:pid(3),qtd:1,preco:420}],142,null,140),

  // Pipeline aberto adicional, distribuído pelas etapas (kanban nasce com movimento real)

    ["novo","Interesse em óculos de sol",[[5,520]],2],

  abertos.forEach(([etapa,titulo,cb,off],i)=>{
    const cli=clientes[6+i*2] || clientes[6+i] || L;
    negocios.push(deal(cli.id,titulo,etapa,cb.map(([p,v])=>({produtoId:pid(p),qtd:1,preco:v})),off,null,null));
  });

  // Ordens de serviço e parcelas para as vendas fechadas (o pós-venda operacional real)
  const os=[], parcelas=[];
  const hojeRef=new Date(); hojeRef.setHours(0,0,0,0);   // 'today' está sombreado dentro de seed()
  let osNum=1000;
  negocios.filter(n=>n.etapa==="ganho").forEach((n,idx)=>{
    const temLente = n.itens.some(i=>{ const p=produtos.find(x=>x.id===i.produtoId); return p && p.categoria==="Lente"; });
    const diasAtras = Math.round((hojeRef - new Date(n.fechadoEm+"T00:00:00"))/86400000);
    if(temLente){
      osNum++;
      // OS antigas já entregues; as recentes ficam espalhadas pelo fluxo da oficina
      let status="entregue";
      if(diasAtras<=6) status="aguardando";
      else if(diasAtras<=12) status="lab";
      else if(diasAtras<=18) status="chegou";
      else if(diasAtras<=26) status="pronto";
      const prev=new Date(n.fechadoEm+"T00:00:00"); prev.setDate(prev.getDate()+7);
      os.push({id:uid(),negocioId:n.id,clienteId:n.clienteId,numero:osNum,status,
        laboratorio: idx%2? "Lab Nordeste":"Óptica Lab PE",
        enviadoEm: status==="aguardando"? null : n.fechadoEm,
        previsaoEm: prev.toISOString().slice(0,10),
        chegouEm: ["chegou","pronto","entregue"].includes(status)? n.fechadoEm : null,
        entregueEm: status==="entregue"? n.fechadoEm : null, obs:""});
    }
    // Pagamento: mistura de à vista, cartão e crediário (realidade do balcão)
    const modo = idx%3;
    if(modo===0){
      parcelas.push({id:uid(),negocioId:n.id,clienteId:n.clienteId,n:1,total:1,valor:n.valor,
        venceEm:n.fechadoEm,pagoEm:n.fechadoEm,forma:"À vista"});
    } else {
      const qtd = modo===1? 3 : 4;
      const val = Math.round(n.valor/qtd*100)/100;
      for(let k=0;k<qtd;k++){
        const vc=new Date(n.fechadoEm+"T00:00:00"); vc.setMonth(vc.getMonth()+k);
        const venc=vc.toISOString().slice(0,10);
        const pago = vc < hojeRef ? venc : null;   // parcelas já vencidas constam recebidas…
        parcelas.push({id:uid(),negocioId:n.id,clienteId:n.clienteId,n:k+1,total:qtd,valor:val,
          venceEm:venc,pagoEm:pago,forma: modo===1?"Cartão":"Crediário"});
      }
    }
  });
  // …exceto duas, deixadas em atraso de propósito para a régua de cobrança ter o que mostrar
  parcelas.filter(p=>p.forma==="Crediário"&&p.pagoEm).slice(-2).forEach(p=>p.pagoEm=null);

  const db = {
    config:{ nome:"Sua ótica", metaMes:7500, cicloRecompraMeses:18, validadePadrao:12, ddi:"55",
             prazoLabDias:7, laboratorios:["Óptica Lab PE","Lab Nordeste"] },
    clientes, receitas, produtos, negocios, tarefas, os, parcelas
  };
  return db;
}

function d(s){ return s? new Date(s+"T00:00:00") : null; }
function fmtDate(s){ if(!s) return "—"; const x=d(s); return x.toLocaleDateString("pt-BR"); }
function today(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function addMonths(dateStr,m){ const x=d(dateStr); if(!x) return null; x.setMonth(x.getMonth()+ (m||0)); return x; }
function daysUntil(dateObj){ if(!dateObj) return null; return Math.round((dateObj - today())/86400000); }
function monthsAgo(dateStr){ const x=d(dateStr); if(!x) return null; return (today()-x)/(86400000*30.44); }
function initials(nome){ return nome.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }

/* ---------- Lógica de recompra (o coração do sistema) ---------- */
// Para cada cliente calcula: última compra, receita vigente, status de recompra.
function recompraInfo(c){
  const ganhos = DB.negocios.filter(n=>n.clienteId===c.id && n.etapa==="ganho");
  const ultima = ganhos.map(g=>g.fechadoEm||g.atualizadoEm).sort().pop() || null;
  const rxs = DB.receitas.filter(r=>r.clienteId===c.id).sort((a,b)=> a.data<b.data?1:-1);
  const rx = rxs[0] || null;
  const rxVenc = rx ? addMonths(rx.data, rx.validadeMeses) : null;
  const diasRx = rxVenc ? daysUntil(rxVenc) : null;               // <0 vencida
  const mesesCompra = ultima ? monthsAgo(ultima) : null;
  const ciclo = DB.config.cicloRecompraMeses;

  let status="ok", motivo="", score=0;
  if(diasRx!==null && diasRx < 0){ status="alert"; motivo="Receita vencida há "+Math.abs(diasRx)+"d"; score=100+Math.abs(diasRx); }
  else if(diasRx!==null && diasRx <= 60){ status="warn"; motivo="Receita vence em "+diasRx+"d"; score=60-diasRx+40; }
  else if(mesesCompra!==null && mesesCompra >= ciclo){ status="warn"; motivo="Última compra há "+Math.round(mesesCompra)+" meses"; score=Math.round(mesesCompra); }
  else if(mesesCompra!==null && mesesCompra >= ciclo*0.66){ status="soon"; motivo="Aproximando do ciclo ("+Math.round(mesesCompra)+"m)"; score=Math.round(mesesCompra)-5; }
  return {ultima,rx,rxVenc,diasRx,mesesCompra,status,motivo,score};
}
function recompraList(){
  return DB.clientes.map(c=>({c,info:recompraInfo(c)}))
    .filter(x=> x.info.status==="alert"||x.info.status==="warn"||x.info.status==="soon")
    .sort((a,b)=> b.info.score - a.info.score);
}
function aniversariantes(dias){
  dias = dias||30; const t=today();
  return DB.clientes.filter(c=>c.nascimento).map(c=>{
    const nb=d(c.nascimento); const prox=new Date(t.getFullYear(),nb.getMonth(),nb.getDate());
    if(prox<t) prox.setFullYear(t.getFullYear()+1);
    return {c,dias:Math.round((prox-t)/86400000),idade:prox.getFullYear()-nb.getFullYear()};
  }).filter(x=>x.dias<=dias).sort((a,b)=>a.dias-b.dias);
}

/* ============================================================
   FILA DE TRABALHO
   Uma lista só, atravessando os seis módulos, ordenada por evidência.

   O compromisso que sustenta a tela: cada linha separa o FATO (o que está
   no banco e o usuário pode conferir) da SUGESTÃO (o que o sistema acha
   que fazer). O peso é calculado sobre o fato, nunca sobre a sugestão —
   um CRM que embaralha os dois ensina o operador a confiar em palpite.
   ============================================================ */
function escFila(s){
  // Local e autocontida de propósito: títulos de tarefa e nomes de cliente são
  // texto livre do usuário e entram em template string. Não dependo de helper
  // declarado em outro ponto do arquivo.
  return String(s==null?"":s).replace(/[&<>"']/g, ch =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function diasEntre(a,b){ return Math.round((a-b)/86400000); }
function plural(n,s,p){ return n+" "+(Math.abs(n)===1?s:p); }

function filaTrabalho(){
  const t=today(), itens=[];

  // A régua de follow-up cobre três coisas que a fila já avisava (receita
  // vencendo, orçamento parado, aniversário). Quando a etapa da régua está
  // pendente para aquele cliente, ela substitui o aviso antigo: a mesma
  // pessoa aparecer duas vezes empurra quem precisa de outra coisa para baixo.
  const fu = fuPendentes().hoje;
  const fuReceita = new Set(fu.filter(e=>e.regra.gatilho==="receita").map(e=>e.cliente.id));
  const fuOrcamento = new Set(fu.filter(e=>e.regra.gatilho==="orcamento").map(e=>e.ctx.negocio && e.ctx.negocio.id));
  const fuAniversario = fuCfg().regras.some(r=>r.ativo && r.gatilho==="aniversario");

  // 1. Tarefa vencida — o fato é a data, não a importância da tarefa.
  tarefasVencidas().forEach(tr=>{
    const c=cliente(tr.clienteId), atraso=diasEntre(t,d(tr.venceEm));
    itens.push({ peso:100+atraso, tom:"alert", tipo:"Tarefa", cliente:c,
      fato:`"${escFila(tr.titulo)}" ${atraso<=0?"vence hoje":"venceu há "+plural(atraso,"dia","dias")}`,
      sugestao:"Resolver e dar baixa, ou remarcar com data real",
      acao:`<button class="btn sm" onclick="toggleTarefa('${tr.id}')">Concluir</button>` });
  });

  // 2. Recompra — só alerta e atenção. "Aproximando do ciclo" não é trabalho de hoje.
  recompraList().filter(x=>(x.info.status==="alert"||x.info.status==="warn") && !fuReceita.has(x.c.id)).forEach(x=>{
    const venc = x.info.status==="alert";
    itens.push({ peso:x.info.score, tom:venc?"alert":"warn", tipo:"Recompra", cliente:x.c,
      fato:`${escFila(x.c.nome)}: ${escFila(x.info.motivo.toLowerCase())}`,
      sugestao: venc
        ? "Chamar para nova consulta: sem receita válida não há venda correta"
        : "Avisar agora, enquanto ainda dá tempo de agendar antes de vencer" });
  });

  // 3. Óculos pronto e não retirado — custo de ocupar gaveta e de cliente esperando.
  DB.os.filter(o=>o.status==="pronto").forEach(o=>{
    const c=cliente(o.clienteId), parado=o.chegouEm? diasEntre(t,d(o.chegouEm)) : null;
    itens.push({ peso:85+(parado||0), tom:"warn", tipo:"Oficina", cliente:c,
      fato:`OS ${escFila(o.numero)} pronta para retirada${parado!==null&&parado>0?" há "+plural(parado,"dia","dias"):""}`,
      sugestao:"Avisar que o óculos chegou e combinar a retirada" });
  });

  // 4. Parcela em atraso.
  parcelasAtrasadas().forEach(p=>{
    const c=cliente(p.clienteId), atraso=diasEntre(t,d(p.venceEm));
    itens.push({ peso:75+atraso, tom:"alert", tipo:"Financeiro", cliente:c,
      fato:`Parcela ${p.n}/${p.total} de ${brl(p.valor)} vencida há ${plural(atraso,"dia","dias")}`,
      sugestao:"Lembrete cordial primeiro: cobrança dura afasta o cliente que volta" });
  });

  // 5. Negócio parado no funil. 14 dias é o limiar; abaixo disso é negociação normal.
  pipelineAberto().forEach(n=>{
    const ref=n.atualizadoEm||n.criadoEm; if(!ref) return;
    const parado=diasEntre(t,d(ref)); if(parado<14 || fuOrcamento.has(n.id)) return;
    const c=cliente(n.clienteId), st=stage(n.etapa);
    itens.push({ peso:45+parado, tom:"neutral", tipo:"Funil", cliente:c,
      fato:`"${escFila(n.titulo)}" parado em ${escFila(st?st.nome:n.etapa)} há ${plural(parado,"dia","dias")}`,
      sugestao:"Retomar ou marcar como perdido: funil parado distorce a previsão" });
  });

  // 6. Follow-up da régua: a mensagem já vem pronta, o botão envia e registra.
  fu.forEach(e=>{
    itens.push({ peso:e.peso, tom:"accent", tipo:"Follow-up", cliente:e.cliente, semWa:true,
      fato:`${escFila(e.regra.nome)}: ${escFila(e.cliente.nome)} · ${escFila(fuDescPrazo(e.regra).toLowerCase())}`,
      sugestao:"Mensagem pronta; revise se quiser personalizar",
      acao:`${fuBotaoEnviar(e,"Enviar")}<button class="btn sm" onclick="fuRevisar('${e.id}')">Revisar</button>` });
  });

  // 7. Aniversário na semana. Último em peso, de propósito. Com a etapa de
  // aniversário ligada na régua, quem cuida do dia é ela.
  if(!fuAniversario) aniversariantes(7).forEach(a=>{
    itens.push({ peso:30+(7-a.dias), tom:"ok", tipo:"Relacionamento", cliente:a.c,
      fato:`${escFila(a.c.nome)} faz ${a.idade} anos ${a.dias===0?"hoje":"em "+plural(a.dias,"dia","dias")}`,
      sugestao:"Parabenizar sem oferta junto: a mensagem perde o sentido com preço dentro" });
  });

  return itens.sort((a,b)=>b.peso-a.peso).slice(0,25);
}

/* ============================================================
   FOLLOW-UP — régua de relacionamento

   Cada etapa da régua é uma regra: um gatilho (venda, entrega,
   receita, orçamento, inatividade, aniversário), um prazo e um texto.
   O sistema calcula sozinho quem entra em cada etapa e em que dia.
   O envio sai do WhatsApp do aparelho, com um toque — e o registro
   do envio vai para o banco, para a mesma etapa nunca sair duas vezes
   nem por dois vendedores.

   Três travas contra mensagem fora de hora:
     janela   — cada etapa só é oferecida por alguns dias depois da
                data dela. Agradecer uma compra de dois meses atrás
                soa a sistema esquecido, não a cuidado.
     intervalo — cliente que recebeu mensagem há poucos dias espera
                o intervalo mínimo antes da próxima (aniversário não
                espera: a data é a data).
     opt-out  — cliente que pediu para não receber sai da régua
                inteira (LGPD). Fica marcado na ficha.
   ============================================================ */

function hojeISO(){ return isoLocal(today()); }
function somaDias(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }
function primeiroNome(n){ return String(n||"").trim().split(/\s+/)[0]||""; }

// A régua mora na config da loja. Loja que nunca mexeu nela usa a padrão.
function fuCfg(){
  const c = (DB.config && DB.config.followup) || {};
  return {
    regras: Array.isArray(c.regras) && c.regras.length ? c.regras : fuRegrasPadrao(),
    intervaloMin: c.intervaloMin!=null ? Math.max(0, Number(c.intervaloMin)||0) : 7,
  };
}
function fuLista(){ if(!Array.isArray(DB.followups)) DB.followups=[]; return DB.followups; }
function fuRegra(id){ return fuCfg().regras.find(r=>r.id===id); }
function fuNomeRegra(id){ const r=fuRegra(id); return r ? r.nome : "Etapa removida"; }
function fuDescPrazo(r){
  const p=Number(r.prazo)||0;
  if(r.gatilho==="venda")     return p===0 ? "No dia da venda" : plural(p,"dia","dias")+" após a venda";
  if(r.gatilho==="entrega")   return p===0 ? "No dia da entrega" : plural(p,"dia","dias")+" após a entrega";
  if(r.gatilho==="receita")   return p===0 ? "No dia em que a receita vence" : plural(p,"dia","dias")+" antes de a receita vencer";
  if(r.gatilho==="orcamento") return plural(p,"dia","dias")+" com orçamento sem resposta";
  if(r.gatilho==="inativo")   return plural(p,"mês","meses")+" sem comprar";
  if(r.gatilho==="aniversario") return "No dia do aniversário";
  return "";
}

/* Todos os momentos da régua, passados e futuros, para os clientes
   pedidos (ou todos). Cada evento tem um id estável — regra + referência —
   que é o mesmo id do registro de envio. É isso que impede repetição. */
function fuEventos(clienteId){
  const ev=[], t=today();
  const ativas=fuCfg().regras.filter(r=>r.ativo);
  if(!ativas.length) return ev;
  const clientes = clienteId ? DB.clientes.filter(c=>c.id===clienteId) : DB.clientes;
  const alvo = new Set(clientes.map(c=>c.id));
  const porId = new Map(DB.clientes.map(c=>[c.id,c]));

  // Índices montados uma vez: com milhares de clientes, procurar compra
  // e receita cliente a cliente deixaria a tela lenta a cada render.
  const ganhos = DB.negocios.filter(n=>n.etapa==="ganho" && n.fechadoEm && alvo.has(n.clienteId));
  const ultCompra = new Map();
  ganhos.forEach(n=>{ const u=ultCompra.get(n.clienteId); if(!u || n.fechadoEm>u) ultCompra.set(n.clienteId,n.fechadoEm); });
  const comAberto = new Set(DB.negocios.filter(n=>n.etapa!=="ganho" && n.etapa!=="perdido").map(n=>n.clienteId));
  const ultRx = new Map();
  DB.receitas.forEach(r=>{ if(!alvo.has(r.clienteId)) return; const u=ultRx.get(r.clienteId); if(!u || r.data>u.data) ultRx.set(r.clienteId,r); });
  const osPorNeg = new Map(DB.os.filter(o=>o.negocioId).map(o=>[o.negocioId,o]));

  const add=(regra,c,ref,due,ctx)=>{
    if(!c || !due || isNaN(due)) return;
    ev.push({ id:regra.id+":"+ref, regra, cliente:c, ref, due, ctx:ctx||{} });
  };
  for(const r of ativas){
    const p = Math.max(0, Number(r.prazo)||0);
    if(r.gatilho==="venda"){
      ganhos.forEach(n=>add(r, porId.get(n.clienteId), n.id, somaDias(d(n.fechadoEm),p), {negocio:n}));
    } else if(r.gatilho==="entrega"){
      ganhos.forEach(n=>{
        const o=osPorNeg.get(n.id);
        // Com OS, o relógio só começa quando o óculos sai da loja.
        if(o && !o.entregueEm) return;
        add(r, porId.get(n.clienteId), n.id, somaDias(d(o?o.entregueEm:n.fechadoEm),p), {negocio:n, os:o||null});
      });
    } else if(r.gatilho==="receita"){
      ultRx.forEach((rx,cid)=>{
        const venc=addMonths(rx.data, rx.validadeMeses);
        add(r, porId.get(cid), rx.id, somaDias(venc,-p), {receita:rx, venc});
      });
    } else if(r.gatilho==="orcamento"){
      DB.negocios.filter(n=>n.etapa==="orcamento" && alvo.has(n.clienteId)).forEach(n=>{
        const base=n.atualizadoEm||n.criadoEm; if(!base) return;
        // A data entra na referência: orçamento que andou e voltou é outra conversa.
        add(r, porId.get(n.clienteId), n.id+"@"+base, somaDias(d(base),p), {negocio:n});
      });
    } else if(r.gatilho==="inativo"){
      ultCompra.forEach((ult,cid)=>{
        if(comAberto.has(cid)) return;          // quem está negociando não está inativo
        add(r, porId.get(cid), cid+"@"+ult, addMonths(ult,p), {ultima:ult});
      });
    } else if(r.gatilho==="aniversario"){
      clientes.forEach(c=>{
        if(!c.nascimento) return; const nb=d(c.nascimento); if(!nb) return;
        [t.getFullYear()-1, t.getFullYear(), t.getFullYear()+1].forEach(a=>
          add(r, c, c.id+"@"+a, new Date(a, nb.getMonth(), nb.getDate()), {}));
      });
    }
  }
  return ev;
}

/* O que está na hora de mandar. Devolve duas listas:
     hoje    — pode enviar agora
     seguros — está na data, mas o cliente recebeu mensagem há pouco;
               libera quando o intervalo mínimo passar */
function fuPendentes(){
  const t=today(), cfg=fuCfg();
  const feitos=new Set(fuLista().map(f=>f.id));
  const ultimoEnvio=new Map();
  fuLista().forEach(f=>{
    if(f.status!=="enviado") return;
    const r=fuRegra(f.regra); if(r && r.gatilho==="aniversario") return;
    const u=ultimoEnvio.get(f.clienteId); if(!u || f.feitoEm>u) ultimoEnvio.set(f.clienteId,f.feitoEm);
  });
  const hoje=[], seguros=[];
  for(const e of fuEventos()){
    if(feitos.has(e.id) || e.cliente.optout) continue;
    const atraso=diasEntre(t,e.due);
    const g=FU_GATILHOS[e.regra.gatilho]||{janela:7,peso:50};
    if(atraso<0 || atraso>g.janela) continue;
    // Lembrete de exame só faz sentido enquanto a receita vale. Vencida,
    // o texto "vence em" ficaria errado, e quem assume é o motor de recompra.
    if(e.regra.gatilho==="receita" && e.ctx.venc && e.ctx.venc<t) continue;
    e.atraso=atraso;
    e.peso=g.peso+Math.min(atraso,20);
    const ult=ultimoEnvio.get(e.cliente.id);
    if(e.regra.gatilho!=="aniversario" && ult && cfg.intervaloMin>0){
      const libera=somaDias(d(ult),cfg.intervaloMin);
      if(libera>t){ e.libera=libera; seguros.push(e); continue; }
    }
    hoje.push(e);
  }
  hoje.sort((a,b)=>b.peso-a.peso || a.cliente.nome.localeCompare(b.cliente.nome));
  seguros.sort((a,b)=>a.libera-b.libera);
  return { hoje, seguros };
}
function fuAchar(id){ const p=fuPendentes(); return p.hoje.find(e=>e.id===id) || p.seguros.find(e=>e.id===id) || null; }

// Próximos contatos de um cliente — o que a régua ainda vai fazer.
function fuProximos(c){
  const t=today(), feitos=new Set(fuLista().map(f=>f.id));
  if(c.optout) return [];
  return fuEventos(c.id).filter(e=>!feitos.has(e.id) && e.due>t)
    .sort((a,b)=>a.due-b.due).slice(0,4);
}

function fuTexto(e){
  const c=e.cliente, x=e.ctx||{};
  const n=x.negocio || null;
  const o=x.os || (n ? osDoNegocio(n.id) : null);
  let venc=x.venc || null;
  if(!venc){
    const rx=DB.receitas.filter(r=>r.clienteId===c.id).sort((a,b)=>a.data<b.data?1:-1)[0];
    if(rx) venc=addMonths(rx.data, rx.validadeMeses);
  }
  const vars={
    nome: primeiroNome(c.nome), nome_completo: c.nome, otica: DB.config.nome||"",
    vendedor: primeiroNome(SESSAO.nome), produto: n ? n.titulo : "",
    data_compra: n && n.fechadoEm ? fmtDate(n.fechadoEm) : (x.ultima ? fmtDate(x.ultima) : ""),
    vencimento_receita: venc ? venc.toLocaleDateString("pt-BR") : "",
    os: o ? String(o.numero) : "",
  };
  return String(e.regra.texto||"")
    .replace(/\{(\w+)\}/g, (m,k)=> (k in vars) ? vars[k] : m)
    .replace(/[ \t]{2,}/g," ").trim();
}

/* Registro do envio. O id do registro é o id do evento: dois aparelhos
   marcando a mesma etapa escrevem na mesma linha, nunca em duas. */
function fuRegistrar(e, status, mensagem){
  const rec={ id:e.id, clienteId:e.cliente.id, regra:e.regra.id, ref:e.ref, status,
    mensagem:mensagem||"", feitoEm:hojeISO(), por:SESSAO.nome||"" };
  const L=fuLista(); const i=L.findIndex(f=>f.id===rec.id);
  if(i>=0) L[i]=rec; else L.push(rec);
  salvar({followups:[rec]});
  return rec;
}

/* Resultado por etapa, nos últimos 90 dias. "Voltou e comprou" é venda
   fechada pelo mesmo cliente em até 30 dias depois da mensagem. É
   coincidência no tempo, não prova de causa — a tela diz isso. */
function fuResultados(){
  const t=today(), ini=isoLocal(somaDias(t,-90));
  const ganhos=DB.negocios.filter(n=>n.etapa==="ganho" && n.fechadoEm);
  const porRegra=new Map();
  // Uma venda precedida por duas mensagens conta nas duas etapas, mas só
  // uma vez no total — senão o total infla e a régua parece render o dobro.
  const vendasTotal=new Map();
  fuLista().filter(f=>f.feitoEm>=ini).forEach(f=>{
    if(!porRegra.has(f.regra)) porRegra.set(f.regra,{enviados:0,pulados:0,voltaram:0,valor:0});
    const m=porRegra.get(f.regra);
    if(f.status==="pulado"){ m.pulados++; return; }
    m.enviados++;
    const lim=isoLocal(somaDias(d(f.feitoEm),30));
    const venda=ganhos.filter(n=>n.clienteId===f.clienteId && n.fechadoEm>f.feitoEm && n.fechadoEm<=lim)
      .sort((a,b)=>a.fechadoEm<b.fechadoEm?-1:1)[0];
    if(venda){ m.voltaram++; m.valor+=venda.valor; vendasTotal.set(venda.id, venda.valor); }
  });
  let valorTotal=0; vendasTotal.forEach(v=>{ valorTotal+=v; });
  return { porRegra, vendas:vendasTotal.size, valor:valorTotal };
}

/* ---------- Tema: preferência do sistema como padrão, escolha do usuário como lei ---------- */
const TKEY="iris_tema";
function temaAtual(){ return document.documentElement.getAttribute("data-theme")||"light"; }
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=$("#themeBtn");
  if(b) b.innerHTML = t==="dark"
    ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>`
    : `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>`;
}
function toggleTema(){ const t=temaAtual()==="dark"?"light":"dark";
  try{ localStorage.setItem(TKEY,t); }catch(e){}
  aplicarTema(t); }
function initTema(){
  let t=null; try{ t=localStorage.getItem(TKEY); }catch(e){}
  if(!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
  aplicarTema(t);
}

/* ---------- Liquid Glass: as três portas de saída ----------
   O CSS já resolve as duas primeiras sozinho (suporte do navegador e
   preferência do sistema). Estas funções cobrem a terceira — a escolha
   explícita do usuário — e servem de diagnóstico na tela de Config:
   sem elas, um vidro ausente por falta de suporte pareceria defeito. */
const GKEY="iris_vidro";
function suportaVidro(){
  try{ return !!(window.CSS && CSS.supports &&
    (CSS.supports("backdrop-filter","blur(2px)") || CSS.supports("-webkit-backdrop-filter","blur(2px)"))); }
  catch(e){ return false; }
}
function sistemaPedeMenosTransparencia(){
  try{ return !!(window.matchMedia && matchMedia("(prefers-reduced-transparency: reduce)").matches); }
  catch(e){ return false; }
}
function vidroEscolhido(){           // o que o usuário pediu, não o que está valendo
  let v=null; try{ v=localStorage.getItem(GKEY); }catch(e){}
  return v==="off" ? "off" : "on";   // padrão: ligado
}
function vidroAtivo(){               // o que de fato está valendo, com as 3 camadas
  return vidroEscolhido()==="on" && suportaVidro() && !sistemaPedeMenosTransparencia();
}
function aplicarVidro(v){
  if(v==="off") document.documentElement.setAttribute("data-glass","off");
  else document.documentElement.removeAttribute("data-glass");
}
function toggleVidro(){
  const v = vidroEscolhido()==="off" ? "on" : "off";
  try{ localStorage.setItem(GKEY,v); }catch(e){}
  aplicarVidro(v);
  render();
  toast(v==="on" ? "Vidro translúcido ligado." : "Vidro desligado.");
}
function initVidro(){ aplicarVidro(vidroEscolhido()); }

/* Transição entre telas: o navegador faz o cross-fade, comunicando que o
   contexto mudou sem quebrar a leitura. Degrada em silêncio onde não há suporte. */
const reduzMovimento = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function render(){
  if(document.startViewTransition && !reduzMovimento){ document.startViewTransition(()=>renderAgora()); }
  else renderAgora();
}
function renderAgora(){
  // Um vendedor que ficou numa tela de admin (trocou de usuário, ou a
  // sessão mudou de papel) volta para o Painel em vez de ver tela vazia.
  if(!podeAdmin() && VIEWS_ADMIN.has(state.view)) state.view="painel";
  renderNav();
  aplicarTema(temaAtual());
  marcarRede();
  const app=$("#app");
  if(state.view==="painel") return renderPainel(app);
  if(state.view==="funil") return renderFunil(app);
  if(state.view==="oficina") return renderOficina(app);
  if(state.view==="financeiro") return renderFinanceiro(app);
  if(state.view==="clientes") return state.clienteSel?renderCliente360(app):renderClientes(app);
  if(state.view==="recompra") return renderRecompra(app);
  if(state.view==="followup") return renderFollowup(app);
  if(state.view==="produtos") return renderProdutos(app);
  if(state.view==="agenda") return renderAgenda(app);
  if(state.view==="config") return renderConfig(app);
}

/* Barras em HTML, não SVG: o SVG escalava com a largura e chegava a 800 px
   de altura no desktop, com rótulos de 24 px. Aqui a altura é fixa e o texto
   tem o tamanho do resto da interface, em qualquer tela. */
function barChart(serie,maxS){
  const meta=DB.config.metaMes||0;
  const top=Math.max(maxS, meta, 1)*1.18;          // folga para o rótulo da barra mais alta
  const curto=v=>brlShort(v).replace('R$ ','');
  return `<div class="barras" role="img" aria-label="Faturamento dos últimos 6 meses">
    <div class="barras-plot">
      ${meta?`<div class="barras-meta" style="bottom:${meta/top*100}%" title="meta ${curto(meta)}"></div>`:''}
      ${serie.map((s,i)=>`<div class="barra${i===serie.length-1?' atual':''}">
        <b class="num">${s.total?curto(s.total):''}</b><i style="height:${Math.max(s.total/top*100,0.8)}%"></i></div>`).join("")}
    </div>
    <div class="barras-mes">${serie.map(s=>`<span>${s.label}</span>`).join("")}</div>
  </div>`;
}
function funnelChart(){
  const open=STAGES.filter(s=>s.id!=="ganho");
  const rows=open.map(s=>{ const ds=DB.negocios.filter(n=>n.etapa===s.id); const val=ds.reduce((a,n)=>a+n.valor,0); return {s,n:ds.length,val}; });
  const maxN=Math.max(1,...rows.map(r=>r.n));
  return rows.map(r=>`<div class="funnel-row">
      <div class="lb"><span class="dot" style="background:${r.s.cor};display:inline-block;margin-right:6px"></span>${r.s.nome}</div>
      <div class="track"><i style="width:${r.n/maxN*100}%;background:${r.s.cor}"></i></div>
      <div class="n num">${r.n} · ${r.val>=1000?brlShort(r.val):"R$ "+Math.round(r.val)}</div></div>`).join("");
}

function dealCard(n){
  const c=cliente(n.clienteId);
  // Só alta e baixa ganham faixa. Média é o normal: onze faixas iguais não diziam nada.
  const pr = n.prioridade==="alta"?"var(--prio-alta)":n.prioridade==="baixa"?"var(--prio-baixa)":"transparent";
  const rx = n.receitaId? DB.receitas.find(r=>r.id===n.receitaId):null;
  return `<div class="deal${_movido===n.id?' landed':''}" draggable="true" ondragstart="dragId='${n.id}';this.classList.add('drag')" ondragend="this.classList.remove('drag')" onclick="modalNegocio('${n.id}')">

/* Coluna fora da tela precisa avisar que existe: sem isso, "Venda fechada"
   e "Entregue" ficavam escondidas à direita sem nenhum sinal. */
function marcarBordas(){
  document.querySelectorAll('.board-wrap').forEach(w=>{
    const b=w.querySelector('.board'), btn=w.querySelector('.board-mais');
    const upd=()=>{
      const dir=b.getBoundingClientRect().right;
      const escondidas=[...b.querySelectorAll('.col')].filter(c=>c.getBoundingClientRect().left>dir-40).length;
      w.classList.toggle('mais-dir', escondidas>0);
      w.classList.toggle('mais-esq', b.scrollLeft>2);
      btn.textContent = escondidas ? `Mais ${escondidas} →` : "";
    };
    b.addEventListener('scroll',upd,{passive:true}); upd();
  });
}
function rolarBoard(btn){ const b=btn.parentElement.querySelector('.board'); b.scrollBy({left:b.clientWidth*0.8,behavior:reduzMovimento?'auto':'smooth'}); }
window.addEventListener('resize',()=>{ if(document.querySelector('.board-wrap')) marcarBordas(); });
function dropDeal(e,stg){
  e.preventDefault(); document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop'));
  const n=DB.negocios.find(x=>x.id===dragId); if(!n||n.etapa===stg) return;
  if(stg==="ganho" && n.etapa!=="ganho"){ modalFecharVenda(n.id); return; }  // exige pagamento e OS antes de fechar
  n.etapa=stg; n.atualizadoEm=new Date().toISOString().slice(0,10);
  _movido=n.id; _colRecebeu=stg;                 // motion: quem se moveu e para onde
  salvar({negocios:[n]}); render(); toast("Negócio movido para “"+stage(stg).nome+"”.");
}
/* Devolve o que tocou, para quem chamou mandar tudo numa gravação só.
   Fechar venda mexe em negócio, estoque e tarefa ao mesmo tempo — se cada
   um fosse para a fila separado, uma queda no meio deixaria o estoque
   baixado sem a venda registrada. */
function ganharNegocio(n){
  n.fechadoEm=new Date().toISOString().slice(0,10);
  n.garantiaMeses=n.garantiaMeses||12;
  // baixa de estoque
  const produtosTocados=[];
  n.itens.forEach(i=>{ const p=produto(i.produtoId);
    if(p&&typeof p.estoque==="number"){ p.estoque=Math.max(0,p.estoque-i.qtd); produtosTocados.push(p); } });
  // pós-venda automático de adaptação (15 dias)
  const rx = n.receitaId? DB.receitas.find(r=>r.id===n.receitaId):null;
  const multi = rx && /multifocal|bifocal|ocupacional/i.test(rx.tipo);
  const dt=new Date(); dt.setDate(dt.getDate()+ (multi?15:7));
  const tarefa={id:uid(),clienteId:n.clienteId,negocioId:n.id,
    titulo: multi?"Pós-venda 15d — adaptação multifocal":"Pós-venda — conferir adaptação",
    tipo:"posvenda",venceEm:dt.toISOString().slice(0,10),feito:false};
  DB.tarefas.push(tarefa);
  return { produtos:produtosTocados, tarefas:[tarefa] };
}

      <td><span class="chip ${a.dias===0?'accent':'neutral'}">${a.dias===0?'Hoje':'em '+plural(a.dias,'dia','dias')}</span></td>

/* Com a etapa Aniversário ligada, os parabéns passam pela régua: assim o envio
   fica registrado e ninguém manda de novo pela tela de Follow-up. Antes do dia,
   não há botão, porque a régua oferece a mensagem na data. */
function parabensRecompra(a){
  const regua=fuCfg().regras.some(r=>r.ativo && r.gatilho==="aniversario");
  if(!regua) return `<a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(a.c.telefone,'Feliz aniversário, '+primeiroNome(a.c.nome)+'!\n\n'+DB.config.nome)}">Parabenizar</a>`;
  if(a.c.optout) return `<span class="muted" style="font-size:12px">não recebe mensagens</span>`;
  const p=fuPendentes(); const e=p.hoje.concat(p.seguros).find(x=>x.cliente.id===a.c.id && x.regra.gatilho==="aniversario");
  if(e) return `<button class="btn wa sm" onclick="fuRevisar('${e.id}')">Parabenizar</button>`;
  const ja=fuLista().some(f=>f.clienteId===a.c.id && (fuRegra(f.regra)||{}).gatilho==="aniversario" && f.feitoEm===hojeISO());
  return `<span class="muted" style="font-size:12px">${ja?"parabéns registrados hoje":"a régua envia no dia"}</span>`;
}
function msgRecompra(c,info){
  const nome=c.nome.split(' ')[0];
  const ass=`\n\n${DB.config.nome}`;
  if(info.status==="alert") return `Olá, ${nome}! Sua receita está vencida. Vale refazer o exame para conferir se o grau mudou. Posso agendar um horário?`+ass;
  if(info.diasRx!==null&&info.diasRx<=60&&info.diasRx>=0) return `Olá, ${nome}! Sua receita vence em breve. Quer já marcar o novo exame?`+ass;
  return `Olá, ${nome}! Faz um tempo desde a sua última troca de óculos. Quer passar aqui para conferir o ajuste e as lentes?`+ass;
}

function renderFila(){
  const fila=filaTrabalho();
  if(!fila.length) return `<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Fila de trabalho</h3></div>
    ${emptyBox('Nada exige ação hoje: nenhum atraso, receita vencida ou óculos parado.')}</div>`;

  const maxPeso=Math.max(...fila.map(i=>i.peso))||1;
  const cor={alert:"var(--alert)",warn:"var(--warn)",ok:"var(--ok)",neutral:"var(--ink-3)",accent:"var(--accent)"};

  const linhas=fila.map(i=>{
    const c=i.cliente;
    // A barra mede a evidência, não a urgência sentida: altura proporcional ao peso
    // calculado sobre dias de atraso e vencimento. Opacidade parcial evita que a
    // barra pese mais no olho do que o próprio fato.
    const alt=Math.max(18,Math.round(i.peso/maxPeso*100));
    const wa = c && !i.semWa ? `<a class="btn wa sm" target="_blank" rel="noopener"
      href="${waLink(c.telefone,'Olá, '+c.nome.split(' ')[0]+'!')}">WhatsApp</a>` : '';
    const ficha = c ? `<button class="btn sm ghost" onclick="abrirCliente('${c.id}')">Ficha</button>` : '';
    return `<div class="fila-item">
      <div class="fila-peso" style="background:${cor[i.tom]||cor.neutral};opacity:.55;height:${alt}%"></div>
      <div style="min-width:0">
        <div class="fila-topo">
          <span class="chip ${i.tom==="neutral"?"neutral":i.tom}">${i.tipo}</span>
          <span class="fila-fato">${i.fato}</span>
        </div>
        <div class="fila-sug"><b>Sugestão</b><i>${i.sugestao}</i></div>
      </div>
      <div class="fila-acoes">${i.acao||''}${ficha}${wa}</div>
    </div>`;
  }).join("");

  return `<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Fila de trabalho</h3><span class="count">${fila.length} ${fila.length===1?'item':'itens'}</span></div>
    <div class="fila-legenda">Uma lista só, atravessando tarefas, recompra, oficina, crediário, funil, follow-up e aniversários, ordenada por evidência.
      O <b>fato</b> é o que está no banco e você pode conferir. A <b>sugestão</b> é opinião do sistema: discorde dela à vontade.</div>
    ${linhas}</div>`;
}
function tarefaTipoLabel(t){ return {ligacao:"Ligação",whatsapp:"WhatsApp",posvenda:"Pós-venda",recompra:"Recompra",geral:"Geral"}[t]||"Geral"; }
function toggleTarefa(id){ const t=DB.tarefas.find(x=>x.id===id); if(!t)return; t.feito=!t.feito; salvar({tarefas:[t]}); render(); }
function concluirTarefa(id){ const t=DB.tarefas.find(x=>x.id===id); if(!t)return; t.feito=true; salvar({tarefas:[t]});
  sairLinha(event, ()=>{ render(); toast("Tarefa concluída."); }); }

function fuTelaResultados(){

    tEnv+=m.enviados; tPul+=m.pulados;
    const taxa=m.enviados? m.voltaram/m.enviados*100 : 0;
    return `<tr>
      <td class="strong">${escFila(fuNomeRegra(id))}</td>
      <td class="num" style="text-align:right">${m.enviados}</td>
      <td class="num" style="text-align:right">${m.pulados}</td>
      <td class="num" style="text-align:right">${m.voltaram}</td>
      <td style="width:150px"><div style="display:flex;align-items:center;gap:8px">
        <div class="bar" style="flex:1"><i style="width:${Math.min(100,taxa)}%;background:var(--accent)"></i></div>
        <span class="num" style="font-size:12px;width:34px;text-align:right">${m.enviados?taxa.toFixed(0)+"%":"—"}</span></div></td>
      <td class="num strong" style="text-align:right">${m.valor?brl(m.valor):"—"}</td>
    </tr>`;
  }).join("");
  return `
  <div class="grid kpis3" style="margin-bottom:16px" id="fuKpis">
    ${kpi("Enviadas 90d", tEnv, `<span class="muted" style="font-size:12px">${tPul} puladas</span>`)}
    ${kpi("Voltaram e compraram", R.vendas, `<span class="muted" style="font-size:12px">em até 30 dias</span>`)}
    ${kpi("Vendas depois da mensagem", brlShort(R.valor), `<span class="muted" style="font-size:12px">sem contar em dobro</span>`)}
  </div>
  <div class="card"><div class="card-h"><h3>Por etapa</h3><span class="count">últimos 90 dias</span></div>
    <div class="fila-legenda">“Voltou e comprou” conta venda fechada pelo mesmo cliente em até 30 dias depois da mensagem.

      <thead><tr><th>Etapa</th><th style="text-align:right">Enviadas</th><th style="text-align:right">Puladas</th>
